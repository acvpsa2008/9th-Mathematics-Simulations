<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;background:#0b0f19;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center;touch-action:manipulation}

.glass{background:rgba(30,41,59,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.75);border-radius:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .22s ease-out forwards}
.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.28rem}.gap-2{gap:.5rem}.gap-3{gap:.7rem}
.w-full{width:100%}.h-full{height:100%}.flex-1{flex:1 1 0%}.flex-shrink-0{flex-shrink:0}
.overflow-y-auto{overflow-y:auto}.overflow-hidden{overflow:hidden}
h2{font-size:1.55rem;font-weight:800;color:#fb923c;margin-bottom:.12rem}
.sub{font-size:1.12rem;color:#94a3b8;margin-bottom:.4rem;line-height:1.4}
label{font-size:1.05rem;font-weight:700;color:#e2e8f0;display:block;margin-bottom:.12rem}
.text-lg{font-size:1.28rem}.text-base{font-size:1.14rem}.text-sm{font-size:1.05rem}.text-xs{font-size:.92rem}
.font-bold{font-weight:700}.font-black{font-weight:900}
.orange{color:#fb923c}.amber{color:#fbbf24}.green{color:#4ade80}.red{color:#f87171}.blue{color:#60a5fa}.slate{color:#94a3b8}
.input{background:#0f172a;border:2px solid #475569;color:#fff;border-radius:.5rem;padding:.5rem .65rem;font-size:1.15rem;font-weight:700;outline:none;width:100px;text-align:center}
.input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.35)}
.input-wide{width:100%;max-width:280px;text-align:left}
.btn{cursor:pointer;border:none;border-radius:.5rem;font-weight:700;font-size:1.05rem;padding:.5rem 1rem;transition:all .12s}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover{background:#f97316}
.btn-dark{background:#1e293b;color:#e2e8f0;border:1px solid #475569}.btn-dark:hover{background:#334155}
.btn-sm{padding:.35rem .7rem;font-size:.95rem}
.tab-bar{display:flex;overflow-x:auto;gap:.28rem;padding:.4rem .6rem;background:#0f172a;border-bottom:1px solid rgba(255,255,255,.12);flex-shrink:0}
.tab{display:flex;align-items:center;gap:.25rem;padding:.48rem .8rem;border-radius:.5rem;font-size:.94rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap;background:transparent;color:#94a3b8}
.tab:hover{background:#1e293b;color:#e2e8f0}
.tab.on{background:#ea580c;color:#fff;box-shadow:0 3px 12px rgba(234,88,12,.5)}
.card{background:rgba(30,41,59,.97);border:1px solid rgba(255,255,255,.13);border-radius:.85rem;padding:.85rem 1.05rem;display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;margin-bottom:.4rem}
.result-box{background:#0f172a;border:1px solid #475569;border-radius:.6rem;padding:.65rem .9rem;font-size:1.12rem;line-height:1.45}
.tip{margin-top:.3rem;padding:.6rem .85rem;background:rgba(251,191,36,.2);border-left:5px solid #fbbf24;border-radius:0 .5rem .5rem 0;font-size:1.1rem;color:#f1f5f9;line-height:1.4}
.tip-blue{margin-top:.3rem;padding:.6rem .85rem;background:rgba(96,165,250,.2);border-left:5px solid #60a5fa;border-radius:0 .5rem .5rem 0;font-size:1.1rem;color:#f1f5f9;line-height:1.4}
.tip-green{margin-top:.3rem;padding:.6rem .85rem;background:rgba(52,211,153,.2);border-left:5px solid #34d399;border-radius:0 .5rem .5rem 0;font-size:1.1rem;color:#f1f5f9;line-height:1.4}
.badge{display:inline-block;background:rgba(249,115,22,.35);color:#fb923c;padding:.18rem .6rem;border-radius:999px;font-size:.98rem;font-weight:800}
.quiz-opt{width:100%;text-align:left;padding:.6rem .9rem;border-radius:.55rem;border:2px solid #334155;background:#1e293b;color:#f1f5f9;font-size:1.1rem;font-weight:600;cursor:pointer;margin-bottom:.3rem;display:flex;align-items:center;gap:.55rem}
.quiz-opt:hover{border-color:#f97316;background:rgba(249,115,22,.18)}
.quiz-opt.correct{background:rgba(16,185,129,.32);border-color:#34d399;color:#d1fae5}
.quiz-opt.wrong{background:rgba(239,68,68,.25);border-color:#f87171;color:#fecaca}
.quiz-opt.disabled{pointer-events:none;opacity:.65}
.def-card{background:rgba(15,23,42,.94);border:1px solid #334155;border-radius:.55rem;padding:.6rem .8rem;margin:.22rem 0}
.def-card .title{font-size:1.05rem;font-weight:800;color:#fbbf24;margin-bottom:.1rem}
.def-card .body{font-size:1.08rem;color:#e2e8f0;line-height:1.4}
.space-y-2>*+*{margin-top:.4rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}

.chip{display:inline-flex;align-items:center;padding:.2rem .55rem;border-radius:999px;font-size:.95rem;font-weight:700;background:rgba(249,115,22,.28);color:#fb923c}
.formula-box{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(251,191,36,.12));border:1px solid rgba(249,115,22,.45);border-radius:.6rem;padding:.65rem .9rem;font-size:1.12rem;line-height:1.5;margin:.3rem 0}
.katex{font-size:1.12em !important}
.katex-display{margin:.4rem 0 !important}
.step-line .katex{font-size:1.05em !important}
.fig-box{background:#0f172a;border:1px solid #334155;border-radius:.55rem;padding:.5rem;display:flex;justify-content:center;align-items:center}
.set-box{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:40px;border-radius:8px;font-weight:900;font-size:1.2rem;margin:2px;border:2px solid}

.dash-hero{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
@media(max-width:700px){.dash-hero{grid-template-columns:1fr}}
.dash-stat{background:linear-gradient(145deg,rgba(30,41,59,.95),rgba(15,23,42,.98));border:1px solid rgba(249,115,22,.4);border-radius:.6rem;padding:.65rem .8rem}
.dash-stat-label{font-size:.9rem;font-weight:800;color:#fb923c;text-transform:uppercase;letter-spacing:.04em}
.dash-stat-value{font-size:1.6rem;font-weight:900;color:#f8fafc}
.dash-bar{height:10px;background:#1e293b;border-radius:999px;margin-top:.35rem;overflow:hidden;border:1px solid #334155}
.dash-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ea580c,#fbbf24,#4ade80);transition:width .35s}
.dash-item{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.45rem .6rem;margin-bottom:.22rem;background:rgba(15,23,42,.9);border:1px solid #475569;border-radius:.5rem;cursor:pointer}
.dash-item:hover{border-color:#f97316}
.dash-item.done{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.1)}
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;border:1px solid #f97316;border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:600;max-width:240px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.tip-wrap:hover .tip-bubble{opacity:1}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(249,115,22,.3);color:#fb923c;font-size:.72rem;font-weight:900;cursor:help;margin-left:4px;border:1px solid rgba(249,115,22,.55)}
.step-line{padding:.25rem 0;border-bottom:1px dashed #334155;font-size:1.05rem}
.step-line:last-child{border-bottom:none}

</style>
</head>
<body>
<div id="root" class="viewport-wrapper">
  <div id="boot-msg" style="color:#94a3b8;font-size:1.15rem;text-align:center;padding:2rem;max-width:440px;line-height:1.55">
    <div style="font-size:2.2rem;margin-bottom:.6rem">⏳</div>
    <strong style="color:#e2e8f0">Loading Number Systems…</strong><br>
    <span style="font-size:.95rem;color:#64748b">Needs internet for React &amp; KaTeX.<br>If stuck, press F12 → Console, or use Live Server.</span>
  </div>
</div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}
const sound = new SoundEngine();

function MathTex({tex, display}) {
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current && window.katex){
      try{ window.katex.render(tex, ref.current, {throwOnError:false, displayMode:!!display}); }
      catch(e){ ref.current.textContent = tex; }
    } else if(ref.current) {
      ref.current.textContent = tex;
    }
  },[tex, display]);
  if(display) return <div ref={ref} style={{margin:'0.35rem 0', overflowX:'auto'}}/>;
  return <span ref={ref}/>;
}

function Tip({ text }) {
  return (<span className="tip-wrap"><span className="tip-icon" tabIndex={0}>?</span><span className="tip-bubble" role="tooltip">{text}</span></span>);
}

function ProgressDash({ visited, quizBest, quizAttempts, onGoTab }) {
  const topics = [
    {id:'overview', name:'Overview', goal:'Hierarchy N ⊂ W ⊂ Z ⊂ Q ⊂ R'},
    {id:'sets', name:'Number Sets', goal:'Natural, Whole, Integers, Rationals'},
    {id:'rationals', name:'Rationals Between', goal:'Find rationals between two numbers'},
    {id:'irrationals', name:'Irrationals', goal:'√2, π and non-recurring decimals'},
    {id:'line', name:'Number Line', goal:'Locate square roots geometrically'},
    {id:'decimals', name:'Decimals', goal:'Terminating / recurring / non-recurring'},
    {id:'convert', name:'Decimal → Fraction', goal:'Convert recurring decimals to p/q'},
    {id:'practice', name:'Practice', goal:'Worked exercises'},
    {id:'quiz', name:'Quiz', goal:'Score 5+ out of 6'},
    {id:'board', name:'Board', goal:'Scratch work'},
  ];
  const total = topics.length;
  const visitedCount = topics.filter(t => visited[t.id]).length;
  const pct = Math.round(visitedCount / total * 100);
  const stars = quizBest >= 5 ? 3 : quizBest >= 4 ? 2 : quizBest >= 3 ? 1 : 0;
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>📊 Progress Dashboard <Tip text="Visit each topic and take the quiz. Best score is saved here." /></h2>
      <p className="sub">NCERT Class 9 · Chapter 1 · Number Systems</p>
      <div className="dash-hero">
        <div className="dash-stat">
          <div className="dash-stat-label">Exploration</div>
          <div className="dash-stat-value"><span className="green">{visitedCount}</span><span style={{color:'#64748b',fontSize:'1rem'}}>/{total}</span></div>
          <div className="dash-bar"><div className="dash-bar-fill" style={{width:pct+'%'}}/></div>
          <div className="text-sm slate">{pct}% complete</div>
        </div>
        <div className="dash-stat">
          <div className="dash-stat-label">Quiz best</div>
          <div className="dash-stat-value"><span className="green">{quizBest}</span><span style={{color:'#64748b',fontSize:'1rem'}}>/6</span></div>
          <div className="text-sm slate">{quizAttempts} attempts · {'⭐'.repeat(stars)||'☆'}</div>
        </div>
      </div>
      <div className="result-box" style={{marginTop:6}}>
        {topics.map(t => (
          <div key={t.id} className={'dash-item '+(visited[t.id]?'done':'')} onClick={()=>{sound.playClick();onGoTab(t.id);}}>
            <div>
              <div className="font-bold" style={{color:'#f8fafc'}}>{t.name}</div>
              <div className="text-sm slate">{t.goal}</div>
            </div>
            <span>{visited[t.id]?'✅':'⬜'}</span>
          </div>
        ))}
      </div>
      <div className="tip-blue"><strong className="blue">Goal:</strong> Explore all topics and score ≥ 5/6 on the quiz.</div>
      <div className="formula-box">Key: N ⊂ W ⊂ Z ⊂ Q ⊂ R · Rational ⇔ terminating or recurring decimal · Irrational ⇔ non-terminating non-recurring</div>
    </div>
  );
}

function OverviewTab(){
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>1. Number Systems</h2>
      <p className="sub">NCERT Class 9 • From natural numbers to real numbers — sets, decimals and the number line.</p>
      <div className="grid-2">
        <div className="def-card">
          <div className="title">Learning goals</div>
          <div className="body">• Natural, Whole, Integers, Rationals, Irrationals, Reals<br/>• Nested relationship of number sets<br/>• Finding rationals between two numbers<br/>• Locating square roots on the number line<br/>• Decimal expansions (terminating / recurring / non-recurring)</div>
        </div>
        <div className="def-card">
          <div className="title">Hierarchy of sets</div>
          <div className="body" style={{textAlign:'center',padding:'.4rem 0'}}>
            <div className="flex flex-wrap justify-center gap-1">
              <span className="set-box" style={{background:'rgba(249,115,22,.25)',borderColor:'#f97316',color:'#fb923c'}}>N</span>
              <span className="slate"> subset </span>
              <span className="set-box" style={{background:'rgba(251,191,36,.25)',borderColor:'#fbbf24',color:'#fbbf24'}}>W</span>
              <span className="slate"> subset </span>
              <span className="set-box" style={{background:'rgba(96,165,250,.25)',borderColor:'#60a5fa',color:'#60a5fa'}}>Z</span>
              <span className="slate"> subset </span>
              <span className="set-box" style={{background:'rgba(52,211,153,.25)',borderColor:'#34d399',color:'#34d399'}}>Q</span>
              <span className="slate"> subset </span>
              <span className="set-box" style={{background:'rgba(244,114,182,.25)',borderColor:'#f472b6',color:'#f472b6'}}>R</span>
            </div>
            <div className="text-sm slate mt-1">N ⊂ W ⊂ Z ⊂ Q ⊂ R</div>
          </div>
        </div>
      </div>
      <div className="formula-box">
        <strong className="orange">Key idea:</strong> Every real number is either rational or irrational. Every point on the number line corresponds to exactly one real number.
      </div>
      <div className="grid-3">
        <div className="result-box text-center"><div style={{fontSize:26}}>N</div><div className="font-bold orange">Natural</div><div className="text-sm slate">1, 2, 3, …</div></div>
        <div className="result-box text-center"><div style={{fontSize:26}}>Q</div><div className="font-bold orange">Rational</div><div className="text-sm slate"><MathTex tex="p/q" /> (q≠0)</div></div>
        <div className="result-box text-center"><div style={{fontSize:26}}>R</div><div className="font-bold orange">Real</div><div className="text-sm slate">Q ∪ Irrationals</div></div>
      </div>
    </div>
  );
}

function SetsTab(){
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Number Sets</h2>
      <p className="sub">Build the sets step by step, as in the chapter “bag of numbers” story.</p>
      <div className="grid-2">
        <div className="def-card"><div className="title">N — Natural numbers</div><div className="body">1, 2, 3, 4, … (counting numbers). Infinite.</div></div>
        <div className="def-card"><div className="title">W — Whole numbers</div><div className="body">0, 1, 2, 3, … = N ∪ {'{'}0{'}'}</div></div>
        <div className="def-card"><div className="title">Z — Integers</div><div className="body">…, −3, −2, −1, 0, 1, 2, 3, … (German Zahlen “to count”)</div></div>
        <div className="def-card"><div className="title">Q — Rational numbers</div><div className="body">All numbers of the form <MathTex tex="p/q" /> where p, q are integers and q ≠ 0. Includes N, W, Z.</div></div>
      </div>
      <div className="formula-box">
        <strong>Important:</strong> Equivalent fractions represent the same rational. We usually write <MathTex tex="p/q" /> in lowest terms (p and q co-prime).
      </div>
      <div className="tip-blue">
        <strong>True / False:</strong><br/>
        • Every whole number is a natural number → <span className="red">False</span> (0 is whole but not natural)<br/>
        • Every integer is a rational number → <span className="green">True</span> (m = m/1)<br/>
        • Every rational number is an integer → <span className="red">False</span> (3/5 is not an integer)
      </div>
    </div>
  );
}

function RationalsTab(){
  const [a,setA]=useState('1');
  const [b,setB]=useState('2');
  const [n,setN]=useState('5');
  const [list,setList]=useState(null);
  const find=()=>{
    sound.playClick();
    const x=parseFloat(a), y=parseFloat(b), k=parseInt(n,10);
    if(isNaN(x)||isNaN(y)||isNaN(k)||k<1){ setList({error:'Enter valid numbers'}); return; }
    if(x>=y){ setList({error:'First number must be smaller than second'}); return; }
    const nums=[];
    for(let i=1;i<=k;i++) nums.push(x + i*(y-x)/(k+1));
    setList({nums});
    sound.playSuccess();
  };
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Rationals Between Two Numbers</h2>
      <p className="sub">There are infinitely many rational numbers between any two distinct rationals.</p>
      <div className="row">
        <div><label>From</label><input className="input" value={a} onChange={e=>setA(e.target.value)}/></div>
        <div><label>To</label><input className="input" value={b} onChange={e=>setB(e.target.value)}/></div>
        <div><label>How many?</label><input className="input" value={n} onChange={e=>setN(e.target.value)}/></div>
        <button className="btn btn-orange" onClick={find}>Find</button>
      </div>
      {list && (list.error ? <div className="tip">{list.error}</div> :
        <div className="tip-green">
          <strong>Numbers found:</strong>
          <div className="mt-1 flex flex-wrap gap-2">
            {list.nums.map((v,i)=><span key={i} className="chip">{Number(v.toFixed(4))}</span>)}
          </div>
        </div>
      )}
      <div className="grid-2">
        <div className="def-card"><div className="title">Method 1 — Midpoint</div><div className="body">The average <MathTex tex="(r+s)/2" /> always lies between r and s. Repeat to get more.</div></div>
        <div className="def-card"><div className="title">Method 2 — Equal steps</div><div className="body">Write both with a large common denominator. Example: 1 = 6/6, 2 = 12/6 → 7/6 … 11/6 lie between them.</div></div>
      </div>
      <div className="formula-box">
        <strong>Chapter example:</strong> Five rationals between 1 and 2: <MathTex tex="7/6,\ 4/3,\ 3/2,\ 5/3,\ 11/6" />
      </div>
    </div>
  );
}

function IrrationalsTab(){
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Irrational Numbers</h2>
      <p className="sub">Numbers that cannot be written as <MathTex tex="p/q" /> with p, q integers, <MathTex tex="q \neq 0" />.</p>
      <div className="def-card">
        <div className="title">Definition</div>
        <div className="body">A number s is irrational if it cannot be expressed as <MathTex tex="p/q" />. Examples: <MathTex tex="\sqrt{2},\ \sqrt{3},\ \pi" /> and 0.10110111011110…</div>
      </div>
      <div className="grid-2">
        <div className="def-card"><div className="title">History</div><div className="body">Pythagoreans (~400 BC) discovered <MathTex tex="\sqrt{2}" /> is irrational. <MathTex tex="\pi" /> was proved irrational only in the late 1700s.</div></div>
        <div className="def-card"><div className="title">Real numbers R</div><div className="body"><MathTex tex="\mathbb{R} = \mathbb{Q} \cup \{\text{irrationals}\}" />. Every real corresponds to a unique point on the number line (Cantor & Dedekind).</div></div>
      </div>
      <div className="formula-box">
        <strong>Remark:</strong> The symbol <MathTex tex="\sqrt{\ }" /> denotes the positive square root. So <MathTex tex="\sqrt{4} = 2" />.
      </div>
      <div className="tip">
        <strong>True / False:</strong><br/>
        • Every irrational is real → <span className="green">True</span><br/>
        • Every real is irrational → <span className="red">False</span><br/>
        • All square roots of positive integers are irrational → <span className="red">False</span> (<MathTex tex="\sqrt{4} = 2" />)
      </div>
    </div>
  );
}

function NumberLineTab(){
  const [mode, setMode] = useState('sqrt2'); // sqrt2 | sqrt3 | spiral
  const [step, setStep] = useState(0);
  const scale = 85;
  const originX = 60;
  const originY = 180;

  const steps2 = [
    { title: 'Step 1 — Draw the number line', body: 'Draw a horizontal number line. Mark origin O as 0 and unit points 1, 2, 3, …' },
    { title: 'Step 2 — Draw unit square', body: 'At O draw a square OABC with each side = 1 unit. OA along the number line, OC perpendicular upward.' },
    { title: 'Step 3 — Draw diagonal OB', body: 'Join O to the opposite corner B. By Pythagoras: OB = √(1² + 1²) = √2.' },
    { title: 'Step 4 — Compass arc', body: 'Place compass centre at O with radius OB. Draw an arc that intersects the positive number line at P.' },
    { title: 'Step 5 — Mark √2', body: 'Point P is the required point. OP = √2 ≈ 1.414. Label it √2 on the number line.' },
  ];
  const steps3 = [
    { title: 'Step 1 — Start from √2', body: 'First locate √2 on the number line (point P). We already have OP = √2.' },
    { title: 'Step 2 — Erect perpendicular', body: 'At P erect a perpendicular of length 1 unit upward. Call the top end D. So PD = 1.' },
    { title: 'Step 3 — Draw OD', body: 'Join O to D. By Pythagoras: OD = √( (√2)² + 1² ) = √(2 + 1) = √3.' },
    { title: 'Step 4 — Compass arc', body: 'With centre O and radius OD, draw an arc intersecting the positive number line at Q.' },
    { title: 'Step 5 — Mark √3', body: 'Point Q represents √3 ≈ 1.732 on the number line.' },
  ];
  const steps = mode === 'sqrt2' ? steps2 : mode === 'sqrt3' ? steps3 : [];
  const maxStep = steps.length - 1;

  const go = (n) => { sound.playClick(); setStep(Math.max(0, Math.min(maxStep, n))); };
  const switchMode = (m) => { sound.playClick(); setMode(m); setStep(0); };

  // Geometry helpers
  const s2 = Math.SQRT2;
  const s3 = Math.sqrt(3);
  const px = (v) => originX + v * scale;
  const py = (v) => originY - v * scale; // up is negative in SVG y

  const showSquare = mode === 'sqrt2' && step >= 1;
  const showDiag2 = mode === 'sqrt2' && step >= 2;
  const showArc2 = mode === 'sqrt2' && step >= 3;
  const showPoint2 = mode === 'sqrt2' && step >= 4;

  const showP = (mode === 'sqrt3' && step >= 0) || (mode === 'sqrt2' && step >= 4);
  const showPerp = mode === 'sqrt3' && step >= 1;
  const showOD = mode === 'sqrt3' && step >= 2;
  const showArc3 = mode === 'sqrt3' && step >= 3;
  const showPoint3 = mode === 'sqrt3' && step >= 4;

  // Arc path for compass (quarter circle-ish from vertical to number line)
  const arcPath = (r) => {
    // from angle ~90° to 0° (top to right) in SVG coords
    const x1 = px(0);
    const y1 = py(r);
    const x2 = px(r);
    const y2 = py(0);
    return `M ${x1} ${y1} A ${r*scale} ${r*scale} 0 0 1 ${x2} ${y2}`;
  };

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Locating √n on the Number Line</h2>
      <p className="sub">Interactive step-by-step geometric construction using the Pythagorean theorem.</p>

      <div className="row" style={{marginBottom:'.35rem'}}>
        <button className={'btn btn-sm '+(mode==='sqrt2'?'btn-orange':'btn-dark')} onClick={()=>switchMode('sqrt2')}>√2 construction</button>
        <button className={'btn btn-sm '+(mode==='sqrt3'?'btn-orange':'btn-dark')} onClick={()=>switchMode('sqrt3')}>√3 construction</button>
        <button className={'btn btn-sm '+(mode==='spiral'?'btn-orange':'btn-dark')} onClick={()=>switchMode('spiral')}>Square-root spiral</button>
      </div>

      {mode !== 'spiral' && (
        <>
          <div className="result-box" style={{padding:'.55rem .8rem'}}>
            <div className="flex justify-between items-center flex-wrap gap-2">
              <div>
                <span className="badge">Step {step+1} / {steps.length}</span>
                <strong className="orange" style={{marginLeft:8,fontSize:'1.05rem'}}>{steps[step].title}</strong>
              </div>
              <div className="flex gap-1">
                <button className="btn btn-dark btn-sm" onClick={()=>go(step-1)} disabled={step===0}>← Prev</button>
                <button className="btn btn-orange btn-sm" onClick={()=>go(step+1)} disabled={step===maxStep}>{step===maxStep?'Done':'Next →'}</button>
                <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setStep(0);}}>Reset</button>
              </div>
            </div>
            <div className="text-sm" style={{marginTop:6,color:'#e2e8f0',lineHeight:1.45}}>{steps[step].body}</div>
          </div>

          <div className="fig-box" style={{padding:'.75rem',minHeight:280}}>
            <svg width="100%" height="280" viewBox="0 0 480 260" style={{maxWidth:480}}>
              {/* Number line */}
              <line x1="20" y1={originY} x2="400" y2={originY} stroke="#475569" strokeWidth="2.5"/>
              {[0,1,2,3].map(i=>(
                <g key={i}>
                  <line x1={px(i)} y1={originY-6} x2={px(i)} y2={originY+6} stroke="#94a3b8" strokeWidth="2"/>
                  <text x={px(i)-4} y={originY+22} fill="#94a3b8" fontSize="13" fontWeight="600">{i}</text>
                </g>
              ))}
              <text x={px(0)-10} y={originY+22} fill="#fb923c" fontSize="12" fontWeight="700">O</text>

              {/* Unit square for √2 */}
              {showSquare && (
                <g>
                  <rect x={px(0)} y={py(1)} width={scale} height={scale} fill="rgba(249,115,22,0.12)" stroke="#f97316" strokeWidth="2"/>
                  <text x={px(0.35)} y={py(0.55)} fill="#fb923c" fontSize="12">1</text>
                  <text x={px(0.05)} y={py(0.45)} fill="#fb923c" fontSize="12">1</text>
                  <circle cx={px(1)} cy={py(1)} r="3" fill="#f97316"/>
                  <text x={px(1)+4} y={py(1)-4} fill="#f97316" fontSize="11">B</text>
                  <text x={px(1)+2} y={originY+16} fill="#94a3b8" fontSize="11">A</text>
                  <text x={px(0)-14} y={py(1)+4} fill="#94a3b8" fontSize="11">C</text>
                </g>
              )}

              {/* Diagonal OB */}
              {showDiag2 && (
                <line x1={px(0)} y1={originY} x2={px(1)} y2={py(1)} stroke="#fbbf24" strokeWidth="2.5"/>
              )}

              {/* Arc for √2 */}
              {showArc2 && (
                <path d={arcPath(s2)} fill="none" stroke="#34d399" strokeWidth="2" strokeDasharray="6 4"/>
              )}

              {/* Point √2 */}
              {(showPoint2 || (mode==='sqrt3' && step>=0)) && (
                <g>
                  <circle cx={px(s2)} cy={originY} r="7" fill="#34d399"/>
                  <text x={px(s2)-10} y={originY-12} fill="#4ade80" fontSize="14" fontWeight="800">√2</text>
                </g>
              )}

              {/* Perpendicular at P for √3 */}
              {showPerp && (
                <g>
                  <line x1={px(s2)} y1={originY} x2={px(s2)} y2={py(1)} stroke="#f97316" strokeWidth="2.5"/>
                  <circle cx={px(s2)} cy={py(1)} r="4" fill="#f97316"/>
                  <text x={px(s2)+6} y={py(1)+4} fill="#fb923c" fontSize="12" fontWeight="700">D</text>
                  <text x={px(s2)+4} y={py(0.5)} fill="#fb923c" fontSize="11">1</text>
                </g>
              )}

              {/* OD hypotenuse */}
              {showOD && (
                <line x1={px(0)} y1={originY} x2={px(s2)} y2={py(1)} stroke="#fbbf24" strokeWidth="2.5"/>
              )}

              {/* Arc for √3 */}
              {showArc3 && (
                <path d={arcPath(s3)} fill="none" stroke="#60a5fa" strokeWidth="2" strokeDasharray="6 4"/>
              )}

              {/* Point √3 */}
              {showPoint3 && (
                <g>
                  <circle cx={px(s3)} cy={originY} r="7" fill="#60a5fa"/>
                  <text x={px(s3)-10} y={originY-12} fill="#93c5fd" fontSize="14" fontWeight="800">√3</text>
                </g>
              )}
            </svg>
          </div>

          <div className="formula-box">
            {mode==='sqrt2' && step>=2 && <MathTex tex="OB=\sqrt{1^2+1^2}=\sqrt{2}\approx 1.414" />}
            {mode==='sqrt3' && step>=2 && <MathTex tex="OD=\sqrt{(\sqrt{2})^2+1^2}=\sqrt{3}\approx 1.732" />}
            {mode==='sqrt2' && step<2 && <span className="slate">Formula appears after the diagonal is drawn.</span>}
            {mode==='sqrt3' && step<2 && <span className="slate">Formula appears after OD is drawn.</span>}
          </div>
        </>
      )}

      {mode==='spiral' && (
        <>
          {(() => {
            const spiralSteps = [
              { title: 'Step 1 — Unit segment', body: 'Draw origin O and a unit segment OA of length 1 along the number line. Point A represents 1.', formula: 'OA = 1', n: 1 },
              { title: 'Step 2 — Erect perpendicular for √2', body: 'At A erect a perpendicular of length 1. Join O to the new tip B. By Pythagoras, OB = √2.', formula: '\\mathrm{OB}=\\sqrt{1^2+1^2}=\\sqrt{2}', n: 2 },
              { title: 'Step 3 — Erect perpendicular for √3', body: 'At B erect a perpendicular of length 1 (perpendicular to OB). Join O to the new tip C. Then OC = √3.', formula: '\\mathrm{OC}=\\sqrt{(\\sqrt{2})^2+1^2}=\\sqrt{3}', n: 3 },
              { title: 'Step 4 — Continue for √4', body: 'At C erect a unit perpendicular to OC. Join O to D. OD = √4 = 2 (a perfect square).', formula: '\\mathrm{OD}=\\sqrt{(\\sqrt{3})^2+1^2}=\\sqrt{4}=2', n: 4 },
              { title: 'Step 5 — Continue for √5', body: 'Repeat: unit perpendicular at D, join O to E. OE = √5.', formula: '\\mathrm{OE}=\\sqrt{(\\sqrt{4})^2+1^2}=\\sqrt{5}', n: 5 },
              { title: 'Step 6 — Continue for √6', body: 'Unit perpendicular at E, join O to F. OF = √6.', formula: '\\mathrm{OF}=\\sqrt{(\\sqrt{5})^2+1^2}=\\sqrt{6}', n: 6 },
              { title: 'Step 7 — Continue for √7', body: 'Unit perpendicular at F, join O to G. OG = √7.', formula: '\\mathrm{OG}=\\sqrt{(\\sqrt{6})^2+1^2}=\\sqrt{7}', n: 7 },
              { title: 'Step 8 — Continue for √8', body: 'Unit perpendicular at G, join O to H. OH = √8 = 2√2.', formula: '\\mathrm{OH}=\\sqrt{(\\sqrt{7})^2+1^2}=\\sqrt{8}=2\\sqrt{2}', n: 8 },
              { title: 'Step 9 — Continue for √9', body: 'Unit perpendicular at H, join O to I. OI = √9 = 3.', formula: '\\mathrm{OI}=\\sqrt{(\\sqrt{8})^2+1^2}=\\sqrt{9}=3', n: 9 },
              { title: 'Step 10 — Continue for √10', body: 'Unit perpendicular at I, join O to J. OJ = √10. The spiral keeps growing.', formula: '\\mathrm{OJ}=\\sqrt{(\\sqrt{9})^2+1^2}=\\sqrt{10}', n: 10 },
              { title: 'Step 11 — General rule', body: 'At each tip √(n−1), erect a perpendicular of length 1. The new hypotenuse from O is √n. Continue indefinitely.', formula: '\\sqrt{n}=\\sqrt{(\\sqrt{n-1})^2+1^2}\\quad (n=2,3,4,\\ldots)', n: 10 },
            ];
            const maxS = spiralSteps.length - 1;
            const s = Math.min(step, maxS);
            const cur = spiralSteps[s];
            const visibleN = cur.n; // how many tips to show

            // Build all spiral points once
            const allPts = [{x:0, y:0}];
            let cx = 1, cy = 0;
            allPts.push({x:cx, y:cy, label:'1', n:1});
            for(let n=2; n<=10; n++){
              const len = Math.sqrt(cx*cx + cy*cy);
              const ux = cx/len, uy = cy/len;
              const nx = cx + (-uy)*1;
              const ny = cy + ux*1;
              allPts.push({x:nx, y:ny, label:'√'+n, n:n});
              cx = nx; cy = ny;
            }
            const ox=110, oy=310, sc=36;
            const toX = (v)=> ox + v*sc;
            const toY = (v)=> oy - v*sc;
            const ptsToShow = allPts.filter((p,i)=> i===0 || p.n <= visibleN);

            return (
              <>
                <div className="result-box" style={{padding:'.55rem .8rem'}}>
                  <div className="flex justify-between items-center flex-wrap gap-2">
                    <div>
                      <span className="badge">Step {s+1} / {spiralSteps.length}</span>
                      <strong className="orange" style={{marginLeft:8,fontSize:'1.05rem'}}>{cur.title}</strong>
                    </div>
                    <div className="flex gap-1">
                      <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setStep(Math.max(0,step-1));}} disabled={step===0}>← Prev</button>
                      <button className="btn btn-orange btn-sm" onClick={()=>{sound.playClick();setStep(Math.min(maxS,step+1));}} disabled={step>=maxS}>{step>=maxS?'Done':'Next →'}</button>
                      <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setStep(0);}}>Reset</button>
                    </div>
                  </div>
                  <div className="text-sm" style={{marginTop:6,color:'#e2e8f0',lineHeight:1.45}}>{cur.body}</div>
                </div>

                <div className="fig-box" style={{padding:'.75rem',minHeight:380}}>
                  <svg width="100%" height="380" viewBox="0 0 560 400" style={{maxWidth:560}}>
                    <line x1={toX(0)} y1={toY(0)} x2={toX(8)} y2={toY(0)} stroke="#334155" strokeWidth="1.5"/>
                    {[0,1,2,3].map(i=>(
                      <g key={i}>
                        <line x1={toX(i)} y1={toY(0)-5} x2={toX(i)} y2={toY(0)+5} stroke="#64748b"/>
                        <text x={toX(i)-4} y={toY(0)+24} fill="#94a3b8" fontSize="14" fontWeight="600">{i}</text>
                      </g>
                    ))}
                    {ptsToShow.slice(1).map((p,i)=>{
                      const prev = ptsToShow[i];
                      const isNewest = p.n === visibleN;
                      return (
                        <g key={i}>
                          {/* unit perpendicular segment */}
                          <line x1={toX(prev.x)} y1={toY(prev.y)} x2={toX(p.x)} y2={toY(p.y)}
                            stroke={isNewest?'#fbbf24':'#f97316'} strokeWidth={isNewest?4:2.5}/>
                          {/* radius (hypotenuse) from O */}
                          <line x1={toX(0)} y1={toY(0)} x2={toX(p.x)} y2={toY(p.y)}
                            stroke={isNewest?'#34d399':'#fbbf24'} strokeWidth={isNewest?3:1.8}
                            strokeDasharray={isNewest?'':'4 3'}/>
                          <circle cx={toX(p.x)} cy={toY(p.y)} r={isNewest?9:6} fill={isNewest?'#34d399':'#22c55e'}/>
                          <text x={toX(p.x)+10} y={toY(p.y)+5} fill={isNewest?'#86efac':'#4ade80'} fontSize={isNewest?16:13} fontWeight="800">{p.label}</text>
                        </g>
                      );
                    })}
                    <circle cx={toX(0)} cy={toY(0)} r="7" fill="#fb923c"/>
                    <text x={toX(0)-16} y={toY(0)+22} fill="#fb923c" fontSize="16" fontWeight="800">O</text>
                  </svg>
                </div>

                <div className="formula-box">
                  <MathTex tex={cur.formula} />
                </div>
              </>
            );
          })()}
        </>
      )}

      <div className="def-card">
        <div className="title">Why this works</div>
        <div className="body">
          Pythagoras theorem in a right triangle with legs a and b gives hypotenuse <MathTex tex="\sqrt{a^2+b^2}" />.
          Starting with legs 1 and 1 gives √2; then legs √2 and 1 give √3; and so on.
        </div>
      </div>
    </div>
  );
}

function DecimalsTab(){
  const [num,setNum]=useState('1');
  const [den,setDen]=useState('7');
  const [res,setRes]=useState(null);
  const expand=()=>{
    sound.playClick();
    const p=parseInt(num,10), q=parseInt(den,10);
    if(isNaN(p)||isNaN(q)||q===0){ setRes({error:'Invalid'}); return; }
    const seen={}, digits=[];
    let rem=Math.abs(p)%Math.abs(q), start=-1;
    for(let i=0;i<40;i++){
      if(rem===0){ setRes({type:'terminating', val:(p/q).toString(), p, q}); sound.playSuccess(); return; }
      if(seen[rem]!==undefined){ start=seen[rem]; break; }
      seen[rem]=i;
      rem*=10;
      digits.push(Math.floor(rem/Math.abs(q)));
      rem%=Math.abs(q);
    }
    if(start>=0){
      setRes({type:'recurring', nonrep:digits.slice(0,start).join(''), rep:digits.slice(start).join(''), p, q});
    } else {
      setRes({type:'long', digits:digits.join(''), p, q});
    }
    sound.playSuccess();
  };
  const presets = [
    {p:'1', q:'2', label:'1/2'},
    {p:'1', q:'3', label:'1/3'},
    {p:'1', q:'6', label:'1/6'},
    {p:'1', q:'7', label:'1/7'},
    {p:'3', q:'8', label:'3/8'},
    {p:'2', q:'11', label:'2/11'},
    {p:'5', q:'6', label:'5/6'},
  ];
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Decimal Expansions <Tip text="Enter p and q, or pick a preset. See whether the expansion terminates or recurs." /></h2>
      <p className="sub">Rationals: terminating or non-terminating recurring. Irrationals: non-terminating non-recurring.</p>
      <div className="row">
        <div><label>Numerator p</label><input className="input" value={num} onChange={e=>setNum(e.target.value)}/></div>
        <div><label>Denominator q</label><input className="input" value={den} onChange={e=>setDen(e.target.value)}/></div>
        <button className="btn btn-orange" onClick={expand}>Expand</button>
      </div>
      <div className="row">
        {presets.map(pr=>(
          <button key={pr.label} className="btn btn-dark btn-sm" onClick={()=>{
            sound.playClick(); setNum(pr.p); setDen(pr.q); setRes(null);
          }}>{pr.label}</button>
        ))}
      </div>
      {res && (res.error ? <div className="tip">{res.error}</div> :
        <div className="tip-green">
          <div style={{marginBottom:6}}>
            <MathTex tex={'\\dfrac{'+res.p+'}{'+res.q+'}'} /> =
            {res.type==='terminating' && <span> <strong className="green">terminating</strong> {res.val}</span>}
            {res.type==='recurring' && (
              <span> <strong className="amber">non-terminating recurring</strong>{' '}
                0.{res.nonrep}<span style={{textDecoration:'overline'}}>{res.rep}</span>
              </span>
            )}
            {res.type==='long' && <span> 0.{res.digits}… (partial)</span>}
          </div>
          {res.type==='recurring' && (
            <div className="text-sm slate">Repeating block length = {res.rep.length}. Non-repeating prefix = “{res.nonrep || '(none)'}”.</div>
          )}
          {res.type==='terminating' && (
            <div className="text-sm slate">Remainder became 0 — the decimal ends.</div>
          )}
        </div>
      )}
      <div className="grid-2">
        <div className="def-card">
          <div className="title">Rational → decimal</div>
          <div className="body">
            • Remainder 0 → terminating (<MathTex tex="\\dfrac{7}{8} = 0.875" />)<br/>
            • Remainders cycle → recurring (<MathTex tex="\\dfrac{1}{7} = 0.\\overline{142857}" />)
          </div>
        </div>
        <div className="def-card">
          <div className="title">Irrational → decimal</div>
          <div className="body">Non-terminating non-recurring (<MathTex tex="\\sqrt{2} \\approx 1.414213\\ldots" />, <MathTex tex="\\pi \\approx 3.141592\\ldots" />)</div>
        </div>
      </div>
      <div className="formula-box">
        <strong>Summary:</strong> Terminating or recurring <MathTex tex="\\Leftrightarrow" /> rational. Non-terminating non-recurring <MathTex tex="\\Leftrightarrow" /> irrational.
      </div>
    </div>
  );
}

function ConvertTab(){
  const examples = [
    {id:'e1', label:'0.333…', value:'0.333...', tex:'\\dfrac{1}{3}',
      steps:[
        {label:'Define the unknown', tex:'x = 0.\\overline{3} = 0.333\\ldots', note:'One digit repeats.'},
        {label:'Multiply to align the repeat', tex:'10x = 3.\\overline{3} = 3.333\\ldots', note:'Multiply by 10¹ because the repeating block has length 1.'},
        {label:'Subtract to cancel the tail', tex:'10x - x = 3.333\\ldots - 0.333\\ldots', note:null},
        {label:'Simplify', tex:'9x = 3', note:null},
        {label:'Solve and reduce', tex:'x = \\dfrac{3}{9} = \\dfrac{1}{3}', note:'Divide numerator and denominator by 3.'},
      ]},
    {id:'e2', label:'0.666…', value:'0.666...', tex:'\\dfrac{2}{3}',
      steps:[
        {label:'Define the unknown', tex:'x = 0.\\overline{6}', note:null},
        {label:'Multiply by 10', tex:'10x = 6.\\overline{6}', note:'Repeating length = 1.'},
        {label:'Subtract', tex:'10x - x = 6 \\Rightarrow 9x = 6', note:null},
        {label:'Solve and reduce', tex:'x = \\dfrac{6}{9} = \\dfrac{2}{3}', note:null},
      ]},
    {id:'e3', label:'0.142857…', value:'0.142857...', tex:'\\dfrac{1}{7}',
      steps:[
        {label:'Define the unknown', tex:'x = 0.\\overline{142857}', note:'Six digits repeat (the period of 1/7).'},
        {label:'Multiply by 10⁶', tex:'10^{6}x = 142857.\\overline{142857}', note:'Shift by the full repeating block.'},
        {label:'Subtract', tex:'10^{6}x - x = 142857', note:'The infinite tails cancel.'},
        {label:'Simplify', tex:'999999x = 142857', note:null},
        {label:'Solve and reduce', tex:'x = \\dfrac{142857}{999999} = \\dfrac{1}{7}', note:'Both divisible by 142857.'},
      ]},
    {id:'e4', label:'1.2727…', value:'1.2727...', tex:'\\dfrac{14}{11}',
      steps:[
        {label:'Define the unknown', tex:'x = 1.\\overline{27}', note:'Two digits repeat after the decimal.'},
        {label:'Multiply by 10²', tex:'100x = 127.\\overline{27}', note:'Shift by 2 places.'},
        {label:'Subtract', tex:'100x - x = 127.\\overline{27} - 1.\\overline{27}', note:null},
        {label:'Simplify', tex:'99x = 126', note:null},
        {label:'Solve and reduce', tex:'x = \\dfrac{126}{99} = \\dfrac{14}{11}', note:'Divide by 9.'},
      ]},
    {id:'e5', label:'0.23535…', value:'0.23535...', tex:'\\dfrac{233}{990}',
      steps:[
        {label:'Define the unknown', tex:'x = 0.2\\overline{35}', note:'One non-repeating digit, then “35” repeats.'},
        {label:'Clear the non-repeating part', tex:'10x = 2.\\overline{35}', note:'Multiply by 10¹ to move past the single non-repeating digit.'},
        {label:'Align the repeating block', tex:'1000x = 235.\\overline{35}', note:'Multiply original x by 10³ (= 10 × 10²).'},
        {label:'Subtract the two equations', tex:'1000x - 10x = 235.\\overline{35} - 2.\\overline{35}', note:null},
        {label:'Simplify and solve', tex:'990x = 233 \\Rightarrow x = \\dfrac{233}{990}', note:'Already in lowest terms.'},
      ]},
    {id:'e6', label:'0.09…', value:'0.09...', tex:'\\dfrac{1}{11}',
      steps:[
        {label:'Define the unknown', tex:'x = 0.\\overline{09}', note:'Block “09” has length 2.'},
        {label:'Multiply by 10²', tex:'100x = 9.\\overline{09}', note:null},
        {label:'Subtract', tex:'100x - x = 9 \\Rightarrow 99x = 9', note:null},
        {label:'Solve and reduce', tex:'x = \\dfrac{9}{99} = \\dfrac{1}{11}', note:null},
      ]},
    {id:'e7', label:'0.1̅', value:'0.111...', tex:'\\dfrac{1}{9}',
      steps:[
        {label:'Define the unknown', tex:'x = 0.\\overline{1}', note:null},
        {label:'Multiply by 10', tex:'10x = 1.\\overline{1}', note:null},
        {label:'Subtract', tex:'10x - x = 1 \\Rightarrow 9x = 1', note:null},
        {label:'Solve', tex:'x = \\dfrac{1}{9}', note:null},
      ]},
    {id:'e8', label:'2.5̅', value:'2.555...', tex:'\\dfrac{23}{9}',
      steps:[
        {label:'Define the unknown', tex:'x = 2.\\overline{5}', note:null},
        {label:'Multiply by 10', tex:'10x = 25.\\overline{5}', note:null},
        {label:'Subtract', tex:'10x - x = 23 \\Rightarrow 9x = 23', note:null},
        {label:'Solve', tex:'x = \\dfrac{23}{9}', note:null},
      ]},
    {id:'e9', label:'0.16̅', value:'0.1666...', tex:'\\dfrac{1}{6}',
      steps:[
        {label:'Define the unknown', tex:'x = 0.1\\overline{6}', note:'Non-repeating “1”, then “6” repeats.'},
        {label:'Clear non-repeating digit', tex:'10x = 1.\\overline{6}', note:null},
        {label:'Align the repeat', tex:'100x = 16.\\overline{6}', note:'One more shift by 10.'},
        {label:'Subtract', tex:'100x - 10x = 16.\\overline{6} - 1.\\overline{6}', note:null},
        {label:'Solve and reduce', tex:'90x = 15 \\Rightarrow x = \\dfrac{15}{90} = \\dfrac{1}{6}', note:null},
      ]},
    {id:'e10', label:'3.142 (term.)', value:'3.142', tex:'\\dfrac{1571}{500}',
      steps:[
        {label:'Write as fraction with power of 10', tex:'3.142 = \\dfrac{3142}{1000}', note:'Three digits after the decimal → denominator 10³.'},
        {label:'Find gcd and simplify', tex:'\\gcd(3142,1000) = 2', note:null},
        {label:'Reduce', tex:'\\dfrac{3142 \\div 2}{1000 \\div 2} = \\dfrac{1571}{500}', note:'Lowest terms.'},
      ]},
  ];

  const [dec, setDec] = useState('0.333...');
  const [out, setOut] = useState(null);
  const [stepShown, setStepShown] = useState(0);

  const showAll = () => { if(out && out.steps) setStepShown(out.steps.length); };
  const showNext = () => {
    sound.playClick();
    if(out && out.steps) setStepShown(s => Math.min(s + 1, out.steps.length));
  };

  const convert = () => {
    sound.playClick();
    const s = dec.trim().replace(/…/g,'...').toLowerCase();
    const match = (pred, ex) => { setOut(ex); setStepShown(0); sound.playSuccess(); };
    if(s.indexOf('0.333')===0 || s==='0.3' || s==='0.3...'){ match(null, examples[0]); return; }
    if(s.indexOf('0.666')===0 || s==='0.6' || s==='0.6...'){ match(null, examples[1]); return; }
    if(s.indexOf('0.142857')===0){ match(null, examples[2]); return; }
    if(s.indexOf('1.27')===0){ match(null, examples[3]); return; }
    if(s.indexOf('0.235')===0){ match(null, examples[4]); return; }
    if(s.indexOf('0.09')===0){ match(null, examples[5]); return; }
    if(s.indexOf('0.111')===0 || s==='0.1...' || s==='0.1'){ match(null, examples[6]); return; }
    if(s.indexOf('2.555')===0 || s==='2.5...' || s==='2.5'){ match(null, examples[7]); return; }
    if(s.indexOf('0.166')===0 || s==='0.16...' || s==='0.16'){ match(null, examples[8]); return; }
    if(/^\d+\.\d+$/.test(s)){
      const parts = s.split('.');
      const den = Math.pow(10, parts[1].length);
      let num = parseInt(parts[0]+parts[1], 10);
      const g = (a,b)=>{ while(b){ const t=b; b=a%b; a=t; } return a; };
      const d = g(Math.abs(num), den);
      const num2 = num/d, den2 = den/d;
      setOut({
        tex: num2 + '/' + den2,
        steps: [
          {label:'Write with power-of-10 denominator', tex: s + ' = \\dfrac{' + num + '}{' + den + '}', note:'Count digits after the decimal point.'},
          {label: d>1 ? 'Simplify by gcd' : 'Already lowest terms', tex: d>1 ? ('\\gcd(' + num + ',' + den + ') = ' + d) : (num + '/' + den + ' is already simplified.'), note: null},
          {label:'Result', tex: '\\dfrac{' + num2 + '}{' + den2 + '}', note: null},
        ]
      });
      setStepShown(0);
      sound.playSuccess();
      return;
    }
    setOut({error:'Try one of the example buttons, or a terminating decimal like 3.142'});
    setStepShown(0);
  };

  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Recurring Decimal → Fraction <Tip text="Pick an example or type a decimal. Reveal steps one by one, or show all at once." /></h2>
      <p className="sub">Convert recurring decimals to <MathTex tex="p/q" /> with clear algebraic steps.</p>
      <div className="row">
        <div><label>Decimal (try 0.333… or 1.2727…)</label>
          <input className="input input-wide" value={dec} onChange={e=>{setDec(e.target.value); setOut(null); setStepShown(0);}}/>
        </div>
        <button className="btn btn-orange" onClick={convert}>Convert</button>
      </div>
      <div className="row" style={{marginTop:4}}>
        {examples.map(ex=>(
          <button key={ex.id} className="btn btn-dark btn-sm" onClick={()=>{
            sound.playClick(); setDec(ex.value); setOut(null); setStepShown(0);
          }}>{ex.label}</button>
        ))}
      </div>

      {out && out.error && <div className="tip">{out.error}</div>}

      {out && !out.error && (
        <div className="result-box" style={{marginTop:6}}>
          <div className="flex justify-between items-center" style={{marginBottom:8}}>
            <div className="text-lg"><strong className="orange">Result:</strong> <MathTex tex={out.tex} display={false} /></div>
            <div className="flex gap-1">
              {stepShown < (out.steps||[]).length && (
                <button className="btn btn-orange btn-sm" onClick={showNext}>Next step →</button>
              )}
              {stepShown < (out.steps||[]).length && (
                <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick(); showAll();}}>Show all</button>
              )}
              {stepShown > 0 && stepShown >= (out.steps||[]).length && (
                <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick(); setStepShown(0);}}>Hide steps</button>
              )}
            </div>
          </div>

          {stepShown === 0 && (
            <p className="text-sm slate">Click <strong className="orange">Next step</strong> to reveal the algebra one line at a time.</p>
          )}

          {(out.steps||[]).slice(0, stepShown).map((st,i)=>(
            <div key={i} className="def-card" style={{animation:'fadeIn .2s ease-out'}}>
              <div className="title">Step {i+1}: {st.label}</div>
              <div className="body" style={{marginTop:4}}>
                <MathTex tex={st.tex} display={true} />
                {st.note && <div className="text-sm slate" style={{marginTop:4}}>{st.note}</div>}
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="def-card">
        <div className="title">General method</div>
        <div className="body">
          <div className="step-line">1. Let <MathTex tex="x" /> = the given decimal.</div>
          <div className="step-line">2. Multiply by <MathTex tex="10^{k}" /> where <MathTex tex="k" /> = length of the repeating block (and extra powers of 10 for non-repeating digits).</div>
          <div className="step-line">3. Subtract so the infinite repeating tails cancel.</div>
          <div className="step-line">4. Solve for <MathTex tex="x" /> and simplify the fraction.</div>
        </div>
      </div>
      <div className="formula-box">
        Pure repeating: <MathTex tex="0.\overline{d_1\ldots d_k} = \dfrac{N}{10^{k}-1}" /> where N is the repeating block as an integer.
        <br/>Mixed: shift past non-repeating digits first, then subtract.
      </div>
    </div>
  );
}

function QuizTab({ onQuizComplete, quizBest }){

      <div style={{height:7,background:'#1e293b',borderRadius:4,overflow:'hidden'}}>
        <div style={{height:'100%',background:'linear-gradient(90deg,#f97316,#fbbf24)',width:(((idx+(show?1:0))/qs.length)*100)+'%',transition:'width .3s'}}/>
      </div>
      <h2 style={{fontSize:'1.2rem'}}>{q.q}</h2>
      {q.options.map((o,i)=>{
        let cls='quiz-opt';
        if(show){if(i===q.correct)cls+=' correct';else if(i===sel)cls+=' wrong';else cls+=' disabled';}
        return <button key={i} className={cls} onClick={()=>submit(i)} disabled={show}>
          <span style={{width:28,height:28,borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,flexShrink:0,background:show&&i===q.correct?'#10b981':show&&i===sel?'#ef4444':'#ea580c',color:'#fff'}}>{String.fromCharCode(65+i)}</span>
          <span>{o}</span>

        <div className="mt-2"><button className="btn btn-orange" onClick={next}>{idx+1<qs.length?'Next':'Results'}</button></div>
      </div>}
    </div>
  );
}

function WhiteboardTab(){
  const canvasRef=useRef(null);
  const isDrawing=useRef(false);
  const lastPos=useRef({x:0,y:0});
  const [color,setColor]=useState('#f97316');
  const [size,setSize]=useState(5);
  const colorRef=useRef(color),sizeRef=useRef(size);
  colorRef.current=color;sizeRef.current=size;
  const getPos=useCallback((e)=>{
    const canvas=canvasRef.current;if(!canvas)return{x:0,y:0};
    const rect=canvas.getBoundingClientRect();
    let clientX,clientY;
    if(e.touches&&e.touches.length){clientX=e.touches[0].clientX;clientY=e.touches[0].clientY;}
    else if(e.changedTouches&&e.changedTouches.length){clientX=e.changedTouches[0].clientX;clientY=e.changedTouches[0].clientY;}
    else{clientX=e.clientX;clientY=e.clientY;}
    return{x:(clientX-rect.left)*(canvas.width/rect.width),y:(clientY-rect.top)*(canvas.height/rect.height)};
  },[]);
  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const parent=canvas.parentElement;
    const resize=()=>{
      const dpr=window.devicePixelRatio||1,w=parent.clientWidth,h=parent.clientHeight;
      canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
      const ctx=canvas.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
      ctx.fillStyle='#1e293b';ctx.fillRect(0,0,w,h);
    };
    resize();window.addEventListener('resize',resize);
    const start=e=>{e.preventDefault();isDrawing.current=true;lastPos.current=getPos(e);};
    const stop=e=>{e.preventDefault();isDrawing.current=false;};
    const move=e=>{
      if(!isDrawing.current)return;e.preventDefault();
      const pos=getPos(e),ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=sizeRef.current;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=colorRef.current;
      ctx.beginPath();ctx.moveTo(lastPos.current.x/dpr,lastPos.current.y/dpr);ctx.lineTo(pos.x/dpr,pos.y/dpr);ctx.stroke();
      lastPos.current=pos;
    };
    ['mousedown','mouseup','mouseleave','mousemove','touchstart','touchend','touchcancel','touchmove'].forEach(ev=>{
      const fn=ev.includes('down')||ev.includes('start')?start:(ev.includes('up')||ev.includes('leave')||ev.includes('cancel')||ev.includes('end')?stop:move);
      canvas.addEventListener(ev,fn,{passive:false});
    });
    return()=>window.removeEventListener('resize',resize);
  },[getPos]);
  const clear=()=>{
    sound.playClick();
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
    ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1e293b';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.scale(dpr,dpr);
  };
  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex flex-wrap gap-2 items-center flex-shrink-0">
        <span className="text-sm font-bold slate">Color:</span>
        {['#f97316','#3b82f6','#10b981','#eab308','#ec4899','#ffffff','#f87171'].map(c=>(
          <button key={c} onClick={()=>{sound.playClick();setColor(c)}} style={{width:26,height:26,borderRadius:'50%',border:color===c?'3px solid #fff':'2px solid transparent',background:c,cursor:'pointer'}}/>
        ))}
        <span className="text-sm font-bold slate" style={{marginLeft:4}}>Size:</span>
        {[3,5,8,12].map(s=>(
          <button key={s} className={'btn btn-sm '+(size===s?'btn-orange':'btn-dark')} onClick={()=>{sound.playClick();setSize(s)}}>{s}</button>
        ))}
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear</button>
      </div>
      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600 relative" style={{minHeight:0,touchAction:'none'}}>
        <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block',touchAction:'none',cursor:'crosshair'}}/>
      </div>
      <p className="text-xs slate text-center flex-shrink-0">Draw number lines, square-root spirals or Venn diagrams of number sets.</p>
    </div>
  );
}
