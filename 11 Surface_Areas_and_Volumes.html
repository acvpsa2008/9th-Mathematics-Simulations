<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Surface Areas and Volumes • Class 9</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;background:#0b0f19;color:#f1f5f9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center;touch-action:manipulation}
.viewport-wrapper{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 25% 15%,#1e293b 0%,#0f172a 65%)}
.simulation-container{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.75);display:flex;flex-direction:column;overflow:hidden;background:#0f172a;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
.simulation-container:fullscreen,.simulation-container:-webkit-full-screen{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;border:none}
.glass{background:rgba(30,41,59,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.55);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .2s ease-out forwards}
.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.2rem}.gap-2{gap:.4rem}.w-full{width:100%}.h-full{height:100%}.flex-1{flex:1 1 0%}.flex-shrink-0{flex-shrink:0}
.overflow-y-auto{overflow-y:auto}.overflow-hidden{overflow:hidden}
h2{font-size:1.32rem;font-weight:900;color:#fb923c;margin-bottom:.04rem}
.sub{font-size:1.02rem;color:#e2e8f0;margin-bottom:.2rem;line-height:1.35}
label{font-size:.92rem;font-weight:700;color:#f8fafc;display:block;margin-bottom:.04rem}
.text-lg{font-size:1.15rem}.text-base{font-size:1.05rem}.text-sm{font-size:.98rem}
.font-bold{font-weight:700}.font-black{font-weight:900}
.orange{color:#fb923c}.amber{color:#fbbf24}.green{color:#4ade80}.red{color:#f87171}.blue{color:#60a5fa}.slate{color:#94a3b8}.white{color:#f8fafc}
.input{background:#0f172a;border:2px solid #64748b;color:#fff;border-radius:.35rem;padding:.28rem .4rem;font-size:1.02rem;font-weight:700;outline:none;width:72px;text-align:center}
.input:focus{border-color:#f97316}
.btn{cursor:pointer;border:none;border-radius:.35rem;font-weight:700;font-size:.88rem;padding:.28rem .65rem}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover{background:#f97316}
.btn-dark{background:#1e293b;color:#e2e8f0;border:1px solid #64748b}.btn-dark:hover{background:#334155}
.btn-sm{padding:.22rem .45rem;font-size:.82rem}
.tab-bar{display:flex;overflow-x:auto;gap:.15rem;padding:.24rem .35rem;background:#0f172a;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.tab{display:flex;align-items:center;gap:.14rem;padding:.28rem .45rem;border-radius:.35rem;font-size:.76rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap;background:transparent;color:#94a3b8}
.tab:hover{background:#1e293b;color:#e2e8f0}
.tab.on{background:#ea580c;color:#fff;box-shadow:0 3px 10px rgba(234,88,12,.4)}
.card{background:rgba(30,41,59,.95);border:1px solid rgba(255,255,255,.12);border-radius:.6rem;padding:.45rem .6rem;display:flex;flex-direction:column;height:100%}
.row{display:flex;flex-wrap:wrap;gap:.28rem;align-items:flex-end;margin-bottom:.18rem}
.result-box{background:#0f172a;border:1px solid #475569;border-radius:.4rem;padding:.35rem .5rem;font-size:1rem;line-height:1.4}
.tip{margin-top:.15rem;padding:.35rem .5rem;background:rgba(251,191,36,.2);border-left:4px solid #fbbf24;border-radius:0 .3rem .3rem 0;font-size:.98rem;color:#fef3c7;line-height:1.35}
.tip-blue{margin-top:.15rem;padding:.35rem .5rem;background:rgba(96,165,250,.2);border-left:4px solid #60a5fa;border-radius:0 .3rem .3rem 0;font-size:.98rem;color:#dbeafe;line-height:1.35}
.tip-green{margin-top:.15rem;padding:.35rem .5rem;background:rgba(52,211,153,.2);border-left:4px solid #34d399;border-radius:0 .3rem .3rem 0;font-size:.98rem;color:#d1fae5;line-height:1.35}
.def-card{background:rgba(15,23,42,.95);border:1px solid #475569;border-radius:.35rem;padding:.28rem .45rem;margin:.06rem 0}
.quiz-opt{width:100%;text-align:left;padding:.35rem .5rem;border-radius:.35rem;border:2px solid #334155;background:#1e293b;color:#f1f5f9;font-size:.98rem;font-weight:600;cursor:pointer;margin-bottom:.14rem}
.quiz-opt:hover{border-color:#f97316}
.quiz-opt.correct{background:rgba(16,185,129,.3);border-color:#34d399}
.quiz-opt.wrong{background:rgba(239,68,68,.25);border-color:#f87171}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.28rem}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 5px;border-radius:4px;font-weight:800;font-size:.85rem;background:#1e293b;border:1px solid #64748b;color:#e2e8f0}
.chip.on{background:rgba(249,115,22,.3);border-color:#f97316;color:#fb923c}
.step-btn{padding:.2rem .4rem;font-size:.8rem;border-radius:4px;border:1px solid #64748b;background:#1e293b;color:#e2e8f0;cursor:pointer;font-weight:700}
.step-btn.active{background:#ea580c;border-color:#ea580c;color:#fff}
.dash-hero{display:grid;grid-template-columns:1fr 1fr;gap:.3rem}
.dash-stat{background:linear-gradient(145deg,rgba(30,41,59,.95),rgba(15,23,42,.98));border:1px solid rgba(249,115,22,.4);border-radius:.45rem;padding:.4rem .55rem}
.dash-stat-label{font-size:.78rem;font-weight:800;color:#fb923c;text-transform:uppercase}
.dash-stat-value{font-size:1.35rem;font-weight:900;color:#f8fafc}
.dash-bar{height:8px;background:#1e293b;border-radius:999px;margin-top:.22rem;overflow:hidden;border:1px solid #334155}
.dash-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ea580c,#fbbf24,#4ade80);transition:width .35s}
.dash-item{display:flex;align-items:center;justify-content:space-between;gap:.3rem;padding:.25rem .4rem;margin-bottom:.1rem;background:rgba(15,23,42,.9);border:1px solid #475569;border-radius:.3rem;cursor:pointer}
.dash-item:hover{border-color:#f97316}
.dash-item.done{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.1)}
.svg-stage{background:#0b1220;border:1px solid #334155;border-radius:7px;padding:3px;margin:2px 0;display:flex;justify-content:center}
.svg-stage svg{display:block;max-width:100%;height:auto}
.formula{background:rgba(15,23,42,.95);border:1px dashed #f97316;border-radius:.35rem;padding:.3rem .45rem;font-size:1.02rem;color:#fde68a;margin:.1rem 0;text-align:center}
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-bubble{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;border:1px solid #f97316;border-radius:7px;padding:4px 8px;font-size:.8rem;font-weight:600;max-width:210px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50}
.tip-wrap:hover .tip-bubble{opacity:1}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(249,115,22,.3);color:#fb923c;font-size:.65rem;font-weight:900;cursor:help;margin-left:2px;border:1px solid rgba(249,115,22,.55)}
</style>
</head>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const PI = Math.PI;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.04); g.gain.setValueAtTime(.1,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.04); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.04);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.08); g.gain.setValueAtTime(.12,now+i*.08); g.gain.exponentialRampToValueAtTime(.001,now+i*.08+.2); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.08); o.stop(now+i*.08+.2); }); }catch(e){} }
}
const sound = new SoundEngine();
function Tip({ text }) {
  return (<span className="tip-wrap"><span className="tip-icon">?</span><span className="tip-bubble">{text}</span></span>);
}
function MathTex({ tex, display }) {
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current && window.katex){
      try { window.katex.render(tex, ref.current, { throwOnError:false, displayMode:!!display }); }
      catch(e){ ref.current.textContent = tex; }
    }
  },[tex,display]);
  return <span ref={ref}/>;
}

function clearSvg(svg){ if(!svg) return; while(svg.firstChild) svg.removeChild(svg.firstChild); }
function el(ns,tag,attrs){ const e=document.createElementNS(ns,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

function drawCone(svg, r, h, tilt) {
  if(!svg) return; clearSvg(svg);
  const ns='http://www.w3.org/2000/svg';
  tilt = tilt || 0;
  const cx=160, baseY=215, scale=Math.min(85/Math.max(r,1), 135/Math.max(h,1));
  const rr=r*scale, hh=h*scale;
  const topY=baseY-hh;
  // subtle tilt shifts
  const shift = tilt * 12;
  const topX = cx + shift;
  // base ellipse (perspective)
  const ry = rr*0.32;
  // back half of base (darker)
  svg.appendChild(el(ns,'ellipse',{cx,cy:baseY,rx:rr,ry,fill:'rgba(180,83,9,.35)',stroke:'#c2410c',strokeWidth:'1.5'}));
  // lateral surface - left
  const left=el(ns,'path',{d:`M ${cx-rr} ${baseY} L ${topX} ${topY} L ${cx} ${baseY+ry*0.2} Z`,fill:'rgba(249,115,22,.35)',stroke:'none'});
  svg.appendChild(left);
  // lateral surface - right (lighter for 3D)
  const right=el(ns,'path',{d:`M ${cx+rr} ${baseY} L ${topX} ${topY} L ${cx} ${baseY+ry*0.2} Z`,fill:'rgba(251,191,36,.4)',stroke:'none'});
  svg.appendChild(right);
  // front base ellipse
  svg.appendChild(el(ns,'ellipse',{cx,cy:baseY,rx:rr,ry,fill:'rgba(249,115,22,.25)',stroke:'#fb923c',strokeWidth:'2.2'}));
  // generators
  svg.appendChild(el(ns,'line',{x1:cx-rr,y1:baseY,x2:topX,y2:topY,stroke:'#4ade80',strokeWidth:'2.2'}));
  svg.appendChild(el(ns,'line',{x1:cx+rr,y1:baseY,x2:topX,y2:topY,stroke:'#4ade80',strokeWidth:'2.2'}));
  // height
  svg.appendChild(el(ns,'line',{x1:topX,y1:topY,x2:cx,y2:baseY,stroke:'#60a5fa',strokeWidth:'1.6',strokeDasharray:'5 3'}));
  // vertex
  svg.appendChild(el(ns,'circle',{cx:topX,cy:topY,r:5,fill:'#f97316'}));
  // labels
  const txt=(x,y,s,col,sz)=>{ const t=el(ns,'text',{x,y,'text-anchor':'middle','font-size':sz||12,'font-weight':'800',fill:col}); t.textContent=s; svg.appendChild(t); };
  txt(topX, topY-10, 'V', '#fb923c', 13);
  txt(cx+rr+16, baseY+2, 'r='+r, '#fb923c', 12);
  txt(cx-22, (topY+baseY)/2, 'h='+h, '#60a5fa', 12);
  const l = Math.sqrt(r*r+h*h).toFixed(1);
  txt(cx+rr/2+22, (topY+baseY)/2-4, 'l≈'+l, '#4ade80', 12);
}

function drawSphere(svg, r, tilt) {
  if(!svg) return; clearSvg(svg);
  const ns='http://www.w3.org/2000/svg';
  tilt = tilt || 0;
  const cx=160, cy=135, R=Math.min(95, Math.max(40, r*7.5));
  // gradient-like layers for 3D
  svg.appendChild(el(ns,'circle',{cx,cy,r:R,fill:'rgba(37,99,235,.25)',stroke:'#3b82f6',strokeWidth:'2'}));
  // highlight arc (top-left)
  svg.appendChild(el(ns,'ellipse',{cx:cx-R*0.25,cy:cy-R*0.3,rx:R*0.35,ry:R*0.25,fill:'rgba(255,255,255,.12)',stroke:'none'}));
  // equator
  const eqRy = R*(0.22 + Math.abs(tilt)*0.08);
  svg.appendChild(el(ns,'ellipse',{cx,cy,rx:R,ry:eqRy,fill:'none',stroke:'#fb923c',strokeWidth:'1.8',strokeDasharray:'5 3'}));
  // meridian (tilted)
  const mRx = R*(0.22 + Math.abs(tilt)*0.1);
  svg.appendChild(el(ns,'ellipse',{cx,cy,rx:mRx,ry:R,fill:'none',stroke:'#4ade80',strokeWidth:'1.4',strokeDasharray:'4 3'}));
  // radius line
  svg.appendChild(el(ns,'line',{x1:cx,y1:cy,x2:cx+R,y2:cy,stroke:'#fbbf24',strokeWidth:'2.2'}));
  svg.appendChild(el(ns,'circle',{cx,cy,r:4,fill:'#f97316'}));
  const t=el(ns,'text',{x:cx+R/2,y:cy-10,'text-anchor':'middle','font-size':'13','font-weight':'800',fill:'#fbbf24'});
  t.textContent='r='+r; svg.appendChild(t);
  // outer rim
  svg.appendChild(el(ns,'circle',{cx,cy,r:R,fill:'none',stroke:'#60a5fa',strokeWidth:'2.5'}));
}

function drawHemi(svg, r, tilt) {
  if(!svg) return; clearSvg(svg);
  const ns='http://www.w3.org/2000/svg';
  tilt = tilt || 0;
  const cx=160, cy=175, R=Math.min(95, Math.max(40, r*7.5));
  // dome fill
  const dome=el(ns,'path',{d:`M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}`,fill:'rgba(16,185,129,.3)',stroke:'#34d399',strokeWidth:'2.5'});
  svg.appendChild(dome);
  // highlight
  svg.appendChild(el(ns,'ellipse',{cx:cx-R*0.2,cy:cy-R*0.45,rx:R*0.28,ry:R*0.18,fill:'rgba(255,255,255,.12)',stroke:'none'}));
  // base ellipse (flat face)
  const ry = R*(0.28 + Math.abs(tilt)*0.06);
  svg.appendChild(el(ns,'ellipse',{cx,cy,rx:R,ry,fill:'rgba(249,115,22,.2)',stroke:'#fb923c',strokeWidth:'2.2'}));
  // radius on base
  svg.appendChild(el(ns,'line',{x1:cx,y1:cy,x2:cx+R,y2:cy,stroke:'#fbbf24',strokeWidth:'2'}));
  svg.appendChild(el(ns,'circle',{cx,cy,r:4,fill:'#f97316'}));
  const t=el(ns,'text',{x:cx,y:cy-R*0.45,'text-anchor':'middle','font-size':'13','font-weight':'800',fill:'#4ade80'});
  t.textContent='r='+r; svg.appendChild(t);
}

function ProgressDash({ visited, quizBest, quizAttempts, onGoTab }) {
  const total=6;
  const visitedCount=Object.keys(visited).filter(k=>k!=='0'&&visited[k]).length;
  const pct=Math.round(visitedCount/total*100);
  const topics=[
    {id:'1',name:'Cone Surface',goal:'CSA = πrl · TSA = πr(l+r) · l=√(r²+h²)'},
    {id:'2',name:'Sphere Surface',goal:'SA = 4πr²'},
    {id:'3',name:'Hemisphere',goal:'CSA = 2πr² · TSA = 3πr²'},
    {id:'4',name:'Volume of Cone',goal:'V = (1/3)πr²h'},
    {id:'5',name:'Volume of Sphere',goal:'V = (4/3)πr³ · hemisphere (2/3)πr³'},
    {id:'6',name:'Practice Quiz',goal:'Score 8+ out of 10'},
  ];
  return (
    <div className="card overflow-y-auto">
      <h2>📊 Progress Dashboard <Tip text="Explore each solid, then take the quiz." /></h2>
      <p className="sub">Class 9 · Chapter 11 · Surface Areas and Volumes</p>
      <div className="dash-hero">
        <div className="dash-stat">
          <div className="dash-stat-label">Exploration</div>
          <div className="dash-stat-value"><span className="green">{visitedCount}</span><span style={{color:'#64748b',fontSize:'.95rem'}}>/{total}</span></div>
          <div className="dash-bar"><div className="dash-bar-fill" style={{width:pct+'%'}}/></div>
        </div>
        <div className="dash-stat">
          <div className="dash-stat-label">Quiz best</div>
          <div className="dash-stat-value"><span className="green">{quizBest}</span><span style={{color:'#64748b',fontSize:'.95rem'}}>/10</span></div>
          <div className="text-sm slate">{quizAttempts} attempts</div>
        </div>
      </div>
      <div className="result-box" style={{marginTop:4}}>
        {topics.map(t=>(
          <div key={t.id} className={`dash-item ${visited[t.id]?'done':''}`} onClick={()=>{sound.playClick();onGoTab(t.id);}}>
            <div><div className="font-bold white">{t.id}. {t.name}</div><div className="text-sm slate">{t.goal}</div></div>
            <span>{visited[t.id]?'✅':'⬜'}</span>
          </div>
        ))}
      </div>
      <div className="formula">Cone · Sphere · Hemisphere — surface areas and volumes</div>
    </div>
  );
}

function Tab1() {
  const [r, setR] = useState(7);
  const [h, setH] = useState(24);
  const [tilt, setTilt] = useState(0);
  const l = Math.sqrt(r*r+h*h);
  const csa = PI*r*l;
  const tsa = PI*r*(l+r);
  const ref = useRef(null);
  useEffect(()=>{ drawCone(ref.current, r, h, tilt); },[r,h,tilt]);
  return (
    <div className="card overflow-y-auto">
      <h2>1. Cone — Surface Area <Tip text="Right circular cone: CSA = πrl, TSA = πr(l+r), l = √(r²+h²)." /></h2>
      <p className="sub">3D-style cone — change r, h and rotate the view.</p>
      <div className="grid2">
        <div className="result-box">
          <div className="row">
            <div><label>r</label><input className="input" type="number" min="1" value={r} onChange={e=>{sound.playClick();setR(+e.target.value||1)}}/></div>

            {[ [7,24],[12,16],[7,10] ].map(([rr,hh],i)=>(
              <button key={i} className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setR(rr);setH(hh);}}>{rr}×{hh}</button>
            ))}
          </div>
          <div className="row">
            <div><label>View tilt</label>
              <input type="range" min="-1" max="1" step="0.1" value={tilt} onChange={e=>{sound.playClick();setTilt(+e.target.value)}} style={{width:120,accentColor:'#f97316'}}/>
            </div>
          </div>
          <p className="text-base">l = √(r²+h²) = <span className="amber font-bold">{l.toFixed(3)}</span></p>
          <p className="text-base">CSA = πrl = <span className="green font-bold">{csa.toFixed(2)}</span></p>
          <p className="text-base">TSA = πr(l+r) = <span className="green font-bold">{tsa.toFixed(2)}</span></p>
          <div className="svg-stage"><svg ref={ref} viewBox="0 0 320 250" width="300" height="235"></svg></div>
        </div>
        <div>
          <div className="def-card"><div className="orange font-bold">CSA</div><div className="text-sm"><MathTex tex={'\\pi r l'} /></div></div>
          <div className="def-card"><div className="orange font-bold">TSA</div><div className="text-sm"><MathTex tex={'\\pi r (l + r)'} /></div></div>
          <div className="def-card"><div className="orange font-bold">Slant height</div><div className="text-sm"><MathTex tex={'l = \\sqrt{r^2 + h^2}'} /></div></div>
          <div className="tip"><strong className="amber">Ex:</strong> r=7, l=10 → CSA = 220 (π=22/7)</div>
          <div className="tip-blue"><strong className="blue">Note:</strong> A tent has only CSA (no base canvas).</div>
        </div>
      </div>
      <div className="formula"><MathTex tex={'\\text{CSA}=\\pi r l \\quad · \\quad \\text{TSA}=\\pi r(l+r) \\quad · \\quad l=\\sqrt{r^2+h^2}'} display={true}/></div>
    </div>
  );
}

function Tab2() {

    <div className="card overflow-y-auto">

      <div className="grid2">
        <div className="result-box">
          <div className="row">
            <div><label>r</label><input className="input" type="number" min="1" step="0.5" value={r} onChange={e=>{sound.playClick();setR(+e.target.value||1)}}/></div>
            {[3.5,7,10.5,14].map(v=><button key={v} className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setR(v)}}>{v}</button>)}
          </div>
          <div className="row">
            <div><label>View tilt</label>
              <input type="range" min="-1" max="1" step="0.1" value={tilt} onChange={e=>{sound.playClick();setTilt(+e.target.value)}} style={{width:120,accentColor:'#f97316'}}/>
            </div>
          </div>
          <p className="text-lg green font-black">SA = 4πr² = {sa.toFixed(2)}</p>

        </div>
        <div>
          <div className="def-card"><div className="orange font-bold">Formula</div><div className="text-sm"><MathTex tex={'4\\pi r^2'} /></div></div>
          <div className="def-card"><div className="orange font-bold">Activity idea</div><div className="text-sm">String covering a ball fills 4 equal circles of radius r</div></div>
          <div className="tip"><strong className="amber">Ex:</strong> r=7 → SA = 616 (π=22/7)</div>
          <div className="tip-green"><strong className="green">Circus sphere:</strong> diameter 7 m → SA = 154 m²</div>
        </div>

function Tab3() {

  const tsa = 3*PI*r*r;
  const ref = useRef(null);
  useEffect(()=>{ drawHemi(ref.current, r, tilt); },[r,tilt]);
  return (
    <div className="card overflow-y-auto">
      <h2>3. Hemisphere <Tip text="CSA = 2πr² (curved only). TSA = 3πr² (curved + flat base)." /></h2>
      <p className="sub">3D-style hemisphere — curved dome + flat base.</p>
      <div className="grid2">
        <div className="result-box">
          <div className="row">
            <div><label>r</label><input className="input" type="number" min="1" value={r} onChange={e=>{sound.playClick();setR(+e.target.value||1)}}/></div>
            {[7,10,14,21].map(v=><button key={v} className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setR(v)}}>{v}</button>)}
          </div>
          <div className="row">
            <div><label>View tilt</label>
              <input type="range" min="-1" max="1" step="0.1" value={tilt} onChange={e=>{sound.playClick();setTilt(+e.target.value)}} style={{width:120,accentColor:'#f97316'}}/>
            </div>
          </div>
          <p className="text-base">CSA = 2πr² = <span className="green font-bold">{csa.toFixed(2)}</span></p>
          <p className="text-base">TSA = 3πr² = <span className="green font-bold">{tsa.toFixed(2)}</span></p>
          <div className="svg-stage"><svg ref={ref} viewBox="0 0 320 250" width="300" height="230"></svg></div>
        </div>
        <div>
          <div className="def-card"><div className="orange font-bold">CSA</div><div className="text-sm"><MathTex tex={'2\\pi r^2'} /> (curved only)</div></div>
          <div className="def-card"><div className="orange font-bold">TSA</div><div className="text-sm"><MathTex tex={'3\\pi r^2'} /> (curved + base)</div></div>
          <div className="tip"><strong className="amber">Ex:</strong> r=21 → CSA=2772, TSA=4158 (π=22/7)</div>
          <div className="tip-blue"><strong className="blue">Dome:</strong> Only curved surface is painted.</div>
        </div>
      </div>
      <div className="formula"><MathTex tex={'\\text{CSA}=2\\pi r^2 \\quad · \\quad \\text{TSA}=3\\pi r^2'} display={true}/></div>

function Tab4() {
  const [r, setR] = useState(6);
  const [h, setH] = useState(7);
  const [tilt, setTilt] = useState(0);
  const vol = (1/3)*PI*r*r*h;
  const ref = useRef(null);
  useEffect(()=>{ drawCone(ref.current, r, h, tilt); },[r,h,tilt]);
  return (
    <div className="card overflow-y-auto">
      <h2>4. Volume of a Cone <Tip text="Volume of cone = (1/3) π r² h — one-third the volume of a cylinder with same r and h." /></h2>
      <p className="sub">3D cone — three cone-fulls fill a matching cylinder.</p>
      <div className="grid2">
        <div className="result-box">
          <div className="row">
            <div><label>r</label><input className="input" type="number" min="1" value={r} onChange={e=>{sound.playClick();setR(+e.target.value||1)}}/></div>
            <div><label>h</label><input className="input" type="number" min="1" value={h} onChange={e=>{sound.playClick();setH(+e.target.value||1)}}/></div>
            {[[6,7],[3.5,12],[7,24]].map(([rr,hh],i)=>(
              <button key={i} className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setR(rr);setH(hh);}}>{rr}×{hh}</button>
            ))}
          </div>
          <div className="row">
            <div><label>View tilt</label>
              <input type="range" min="-1" max="1" step="0.1" value={tilt} onChange={e=>{sound.playClick();setTilt(+e.target.value)}} style={{width:120,accentColor:'#f97316'}}/>
            </div>
          </div>
          <p className="text-lg green font-black">V = (1/3)πr²h = {vol.toFixed(2)}</p>
          <div className="svg-stage"><svg ref={ref} viewBox="0 0 320 250" width="300" height="230"></svg></div>
        </div>
        <div>
          <div className="def-card"><div className="orange font-bold">Formula</div><div className="text-sm"><MathTex tex={'V = \\dfrac{1}{3}\\pi r^2 h'} /></div></div>
          <div className="def-card"><div className="orange font-bold">Relation</div><div className="text-sm">3 × V_cone = V_cylinder (same r, h)</div></div>
          <div className="tip"><strong className="amber">Ex:</strong> r=6, h=7 → V = 264 (π=22/7)</div>
          <div className="tip-green"><strong className="green">Tent volume:</strong> find l from CSA, then h from l²=r²+h², then V.</div>
        </div>
      </div>
      <div className="formula"><MathTex tex={'V_{\\text{cone}} = \\dfrac{1}{3}\\pi r^2 h'} display={true}/></div>
    </div>
  );
}

function Tab5() {
  const [r, setR] = useState(7);
  const [mode, setMode] = useState('sphere');
  const [tilt, setTilt] = useState(0);
  const volS = (4/3)*PI*r*r*r;
  const volH = (2/3)*PI*r*r*r;
  const ref = useRef(null);
  useEffect(()=>{
    if(mode==='sphere') drawSphere(ref.current, r, tilt);
    else drawHemi(ref.current, r, tilt);
  },[r,mode,tilt]);
  return (
    <div className="card overflow-y-auto">
      <h2>5. Volume of Sphere & Hemisphere <Tip text="Sphere V = (4/3)πr³. Hemisphere V = (2/3)πr³." /></h2>
      <p className="sub">3D figures — toggle sphere / hemisphere and tilt the view.</p>
      <div className="row">
        <button className={`step-btn ${mode==='sphere'?'active':''}`} onClick={()=>{sound.playClick();setMode('sphere')}}>Sphere</button>
        <button className={`step-btn ${mode==='hemi'?'active':''}`} onClick={()=>{sound.playClick();setMode('hemi')}}>Hemisphere</button>
        <div><label>r</label><input className="input" type="number" min="1" step="0.1" value={r} onChange={e=>{sound.playClick();setR(+e.target.value||1)}}/></div>
        {[3.5,4.9,7,11.2].map(v=><button key={v} className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setR(v)}}>{v}</button>)}
      </div>
      <div className="row">
        <div><label>View tilt</label>
          <input type="range" min="-1" max="1" step="0.1" value={tilt} onChange={e=>{sound.playClick();setTilt(+e.target.value)}} style={{width:140,accentColor:'#f97316'}}/>
        </div>
      </div>
      <div className="grid2">
        <div className="result-box">
          {mode==='sphere' ? (
            <p className="text-lg green font-black">V = (4/3)πr³ = {volS.toFixed(2)}</p>

            <p className="text-lg green font-black">V = (2/3)πr³ = {volH.toFixed(2)}</p>
          )}
          <div className="svg-stage"><svg ref={ref} viewBox="0 0 320 280" width="300" height="250"></svg></div>
        </div>
        <div>
          <div className="def-card"><div className="orange font-bold">Sphere</div><div className="text-sm"><MathTex tex={'V = \\dfrac{4}{3}\\pi r^3'} /></div></div>
          <div className="def-card"><div className="orange font-bold">Hemisphere</div><div className="text-sm"><MathTex tex={'V = \\dfrac{2}{3}\\pi r^3'} /></div></div>
          <div className="tip"><strong className="amber">Ex:</strong> r=11.2 → V ≈ 5887.32 cm³</div>
          <div className="tip-blue"><strong className="blue">Shot-put:</strong> volume × density = mass</div>
        </div>
      </div>
      <div className="formula"><MathTex tex={'V_{\\text{sphere}}=\\dfrac{4}{3}\\pi r^3 \\quad · \\quad V_{\\text{hemi}}=\\dfrac{2}{3}\\pi r^3'} display={true}/></div>
    </div>
  );
}

function Tab6({ onQuizComplete, quizBest }) {
  const questions = [
    {q:'CSA of a cone is:', opts:['πr²','πrl','2πrh','4πr²'], ans:1, why:'Curved surface area = πrl.'},
    {q:'Slant height l equals:', opts:['r+h','√(r²+h²)','r²+h²','rh'], ans:1, why:'Pythagoras: l² = r² + h².'},
    {q:'Surface area of a sphere is:', opts:['2πr²','3πr²','4πr²','πr²'], ans:2, why:'SA = 4πr².'},
    {q:'TSA of a hemisphere is:', opts:['2πr²','3πr²','4πr²','πr²'], ans:1, why:'Curved + base = 2πr² + πr² = 3πr².'},
    {q:'Volume of a cone is:', opts:['πr²h','(1/2)πr²h','(1/3)πr²h','(4/3)πr³'], ans:2, why:'One-third of the cylinder volume.'},
    {q:'Volume of a sphere is:', opts:['(4/3)πr³','(2/3)πr³','4πr³','πr³'], ans:0, why:'V = (4/3)πr³.'},
    {q:'Volume of a hemisphere is:', opts:['(4/3)πr³','(2/3)πr³','2πr³','πr³'], ans:1, why:'Half of sphere volume.'},
    {q:'r=7, l=10. CSA of cone (π=22/7):', opts:['220','210','154','440'], ans:0, why:'πrl = (22/7)×7×10 = 220.'},
    {q:'r=7. SA of sphere (π=22/7):', opts:['154','308','616','1232'], ans:2, why:'4πr² = 4×(22/7)×49 = 616.'},
    {q:'Three cones of equal r,h fill:', opts:['One sphere','One cylinder','One cube','Two cylinders'], ans:1, why:'3 × V_cone = V_cylinder.'},
  ];
  const [q, setQ] = useState(0);
  const [sel, setSel] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const cur = questions[q];
  const choose = (i) => { if(sel!==null)return; sound.playClick(); setSel(i); if(i===cur.ans){setScore(s=>s+1);sound.playSuccess();} };
  return (
    <div className="card overflow-y-auto">
      <h2>6. Practice Quiz <Tip text="10 questions on cone, sphere and hemisphere formulae." /></h2>
      {quizBest>0 && <p className="text-sm slate">Best: <span className="orange font-bold">{quizBest}/10</span></p>}
      {done ? (
        <div className="result-box text-center">
          <p className="text-lg">Score: <span className="orange font-black">{score}/10</span></p>
          <p className="text-sm slate">{score>=8?'Excellent!':score>=5?'Good — revise weak topics.':'Revise the formula tabs.'}</p>
          <button className="btn btn-orange" style={{marginTop:6}} onClick={()=>{ if(onQuizComplete) onQuizComplete(score); setQ(0);setSel(null);setScore(0);setDone(false); }}>Save & Retry</button>
        </div>
      ) : (
        <>
          <div className="result-box">
            <p className="text-sm slate">Q {q+1}/10 · Score {score}</p>
            <p className="text-lg white font-bold">{cur.q}</p>
            {cur.opts.map((o,i)=>(
              <button key={i} className={`quiz-opt ${sel===null?'':(i===cur.ans?'correct':(sel===i?'wrong':''))}`} onClick={()=>choose(i)}>{o}</button>
            ))}
            {sel!==null && <p className="text-sm mt-1"><span className="amber">Why:</span> {cur.why}</p>}
          </div>
          {sel!==null && (
            <button className="btn btn-orange" style={{marginTop:5}} onClick={()=>{
              sound.playClick();
              if(q+1>=questions.length){ setDone(true); if(onQuizComplete) onQuizComplete(score); }
              else { setQ(q+1); setSel(null); }
            }}>{q+1>=questions.length?'Finish':'Next →'}</button>
          )}
        </>
      )}
      <div className="formula" style={{marginTop:5}}><MathTex tex={'\\pi r l · 4\\pi r^2 · \\tfrac13\\pi r^2 h · \\tfrac43\\pi r^3'} display={true}/></div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('0');
  const [muted, setMuted] = useState(false);
  const [isFs, setIsFs] = useState(false);
  const [visited, setVisited] = useState({'0':true});
  const [quizBest, setQuizBest] = useState(0);
  const [quizAttempts, setQuizAttempts] = useState(0);
  useEffect(()=>{ sound.setMuted(muted); },[muted]);
  useEffect(()=>{
    const h=()=>setIsFs(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange',h);
    return ()=>document.removeEventListener('fullscreenchange',h);
  },[]);
  const goTab = (id) => { sound.playClick(); setTab(id); setVisited(v=>({...v,[id]:true})); };
  const onQuizComplete = (score) => { setQuizAttempts(a=>a+1); setQuizBest(b=>Math.max(b,score)); };
  const toggleFs = () => {
    sound.playClick();
    const el=document.querySelector('.simulation-container');
    if(!document.fullscreenElement) el?.requestFullscreen?.().catch(()=>{});
    else document.exitFullscreen?.().catch(()=>{});
  };
  const tabs = [
    {id:'0', label:'0. Progress', icon:'📊'},
    {id:'1', label:'1. Cone SA', icon:'△'},
    {id:'2', label:'2. Sphere SA', icon:'●'},
    {id:'3', label:'3. Hemisphere', icon:'◐'},
    {id:'4', label:'4. Cone Vol', icon:'V△'},
    {id:'5', label:'5. Sphere Vol', icon:'V●'},
    {id:'6', label:'6. Quiz', icon:'✅'},
  ];
  const content = {
    '0': <ProgressDash visited={visited} quizBest={quizBest} quizAttempts={quizAttempts} onGoTab={goTab} />,
    '1': <Tab1/>, '2': <Tab2/>, '3': <Tab3/>, '4': <Tab4/>, '5': <Tab5/>,
    '6': <Tab6 onQuizComplete={onQuizComplete} quizBest={quizBest} />,
  };
  const logoB64 = window.__APMF_LOGO || '';
  return (
    <div className="simulation-container">
      <header className="glass px-4 py-2 flex justify-between items-center flex-shrink-0" style={{borderBottom:'1px solid rgba(255,255,255,.1)'}}>
        <div className="flex items-center gap-3">
          <img src={"data:image/png;base64,"+logoB64} alt="APMF" style={{width:48,height:48,borderRadius:10,objectFit:'contain',background:'transparent'}}/>
          <div>
            <h1 style={{fontSize:17,fontWeight:900,color:'#fff',margin:0}}>Surface Areas and Volumes</h1>
            <p style={{fontSize:12,color:'#94a3b8',margin:0}}>NCERT Class 9 · Chapter 11 · Interactive</p>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <div style={{textAlign:'right',lineHeight:1.25}}>
            <div style={{fontSize:12,fontWeight:700,color:'#fb923c'}}>Andhra Pradesh Mathematics Forum</div>
            <div style={{fontSize:13,fontWeight:700,color:'#fff'}}>Gangalapudi Bhasker Reddy</div>
          </div>
          <div className="flex items-center gap-2" style={{background:'#1e293b',padding:'6px',borderRadius:12,border:'1px solid #334155'}}>
            <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setMuted(!muted)}}>{muted?'🔇':'🔊'}</button>
            <button className="btn btn-dark btn-sm" onClick={toggleFs}>{isFs?'🗗':'⛶'}</button>
          </div>
        </div>
      </header>
      <div className="tab-bar">
        {tabs.map(t=>(
          <button key={t.id} className={`tab ${tab===t.id?'on':''}`} onClick={()=>goTab(t.id)}>
            <span>{t.icon}</span><span>{t.label}</span>
          </button>
        ))}
      </div>
      <main className="flex-1 overflow-hidden p-2"><div className="h-full fade">{content[tab]}</div></main>
      <footer className="glass px-6 py-2 flex justify-between items-center flex-shrink-0" style={{fontSize:12,color:'#94a3b8',borderTop:'1px solid rgba(255,255,255,.1)'}}>
        <span>NCERT Class 9 · Chapter 11 · Surface Areas and Volumes</span>
        <span>Andhra Pradesh Mathematics Forum · <strong style={{color:'#e2e8f0'}}>Gangalapudi Bhasker Reddy</strong></span>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
