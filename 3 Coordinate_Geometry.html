<body>
<div id="root" class="viewport-wrapper"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

class SoundEngine {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }
  setMuted(v){ this.muted=v; }
  playClick(){ if(this.muted)return; this.init(); try{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(620,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(400,this.ctx.currentTime+.05); g.gain.setValueAtTime(.12,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.05); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+.05);}catch(e){} }
  playSuccess(){ if(this.muted)return; this.init(); try{ const now=this.ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,now+i*.1); g.gain.setValueAtTime(.15,now+i*.1); g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25); o.connect(g); g.connect(this.ctx.destination); o.start(now+i*.1); o.stop(now+i*.1+.25); }); }catch(e){} }
}

const sound = new SoundEngine();

function Tip({ text }) {
  return (<span className="tip-wrap"><span className="tip-icon" tabIndex={0}>?</span><span className="tip-bubble" role="tooltip">{text}</span></span>);
}

function ProgressDash({ visited, quizBest, quizAttempts, onGoTab }) {
  const topics = [
    {id:'overview', name:'Overview', goal:'Cartesian plane & coordinates'},
    {id:'why', name:'Why Two Numbers?', goal:'One number is not enough in a plane'},
    {id:'cartesian', name:'Cartesian System', goal:'Axes, origin, abscissa, ordinate'},
    {id:'plot', name:'Plot Points', goal:'Locate (x, y) on the grid'},
    {id:'quadrants', name:'Quadrants', goal:'I (+,+), II (−,+), III (−,−), IV (+,−)'},
    {id:'axes', name:'Points on Axes', goal:'(x,0) on x-axis; (0,y) on y-axis'},
    {id:'practice', name:'Practice', goal:'Worked exercises'},
    {id:'quiz', name:'Quiz', goal:'Score 8+ out of 10'},
    {id:'summary', name:'Summary', goal:'Key facts at a glance'},
    {id:'board', name:'Board', goal:'Scratch work'},
  ];
  const total = topics.length;
  const visitedCount = topics.filter(t => visited[t.id]).length;
  const pct = Math.round(visitedCount / total * 100);
  const stars = quizBest >= 8 ? 3 : quizBest >= 6 ? 2 : quizBest >= 4 ? 1 : 0;
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>📊 Progress Dashboard <Tip text="Visit each topic and take the quiz. Best score is saved here." /></h2>
      <p className="sub">NCERT Class 9 · Chapter 3 · Coordinate Geometry</p>
      <div className="dash-hero">
        <div className="dash-stat">
          <div className="dash-stat-label">Exploration</div>
          <div className="dash-stat-value"><span className="green">{visitedCount}</span><span style={{color:'#64748b',fontSize:'1rem'}}>/{total}</span></div>
          <div className="dash-bar"><div className="dash-bar-fill" style={{width:pct+'%'}}/></div>
          <div className="text-sm slate">{pct}% complete</div>
        </div>
        <div className="dash-stat">
          <div className="dash-stat-label">Quiz best</div>
          <div className="dash-stat-value"><span className="green">{quizBest}</span><span style={{color:'#64748b',fontSize:'1rem'}}>/10</span></div>
          <div className="text-sm slate">{quizAttempts} attempts · {'⭐'.repeat(stars)||'☆'}</div>
        </div>
      </div>
      <div className="result-box" style={{marginTop:6}}>
        {topics.map(t => (
          <div key={t.id} className={'dash-item '+(visited[t.id]?'done':'')} onClick={()=>{sound.playClick();onGoTab(t.id);}}>
            <div>
              <div className="font-bold" style={{color:'#f8fafc'}}>{t.name}</div>
              <div className="text-sm slate">{t.goal}</div>
            </div>
            <span>{visited[t.id]?'✅':'⬜'}</span>
          </div>
        ))}
      </div>
      <div className="tip-blue"><strong className="blue">Goal:</strong> Explore all topics and score ≥ 8/10 on the quiz.</div>
      <div className="formula-box">Key: (x, y) · Origin (0,0) · Abscissa = x · Ordinate = y · Q I (+,+) · Q II (−,+) · Q III (−,−) · Q IV (+,−)</div>
    </div>
  );
}


function quadrantOf(x,y){
  if(x===0&&y===0) return 'Origin';
  if(x===0) return 'y-axis';
  if(y===0) return 'x-axis';
  if(x>0&&y>0) return 'I';
  if(x<0&&y>0) return 'II';
  if(x<0&&y<0) return 'III';
  return 'IV';
}

/* ===== Large interactive Cartesian Grid ===== */
function CoordGrid({points=[], onPlot, range=6, size=440, showGuides=true, highlight=null, showQuadLabels=false, interactive=true}){
  const pad=32;
  const plot=size-2*pad;
  const scale=plot/(2*range);
  const toX=x=>pad+(x+range)*scale;
  const toY=y=>pad+(range-y)*scale;
  const fromXY=(px,py)=>{
    const x=Math.round((px-pad)/scale-range);
    const y=Math.round(range-(py-pad)/scale);
    return {x:Math.max(-range,Math.min(range,x)), y:Math.max(-range,Math.min(range,y))};
  };
  const handleClick=e=>{
    if(!onPlot||!interactive) return;
    const rect=e.currentTarget.getBoundingClientRect();
    const px=(e.clientX-rect.left)*(size/rect.width);
    const py=(e.clientY-rect.top)*(size/rect.height);
    const p=fromXY(px,py);
    sound.playClick();
    onPlot(p);
  };
  const ticks=Array.from({length:2*range+1},(_,i)=>i-range);
  return (
    <svg width={size} height={size} onClick={handleClick} style={{cursor:onPlot&&interactive?'crosshair':'default',background:'#0b1220',borderRadius:10,border:'1px solid #334155',boxShadow:'inset 0 0 40px rgba(0,0,0,.35)'}}>
      {/* quadrant fills */}
      <rect x={toX(0)} y={toY(range)} width={toX(range)-toX(0)} height={toY(0)-toY(range)} fill="rgba(74,222,128,.07)"/>
      <rect x={toX(-range)} y={toY(range)} width={toX(0)-toX(-range)} height={toY(0)-toY(range)} fill="rgba(96,165,250,.07)"/>
      <rect x={toX(-range)} y={toY(0)} width={toX(0)-toX(-range)} height={toY(-range)-toY(0)} fill="rgba(244,114,182,.07)"/>
      <rect x={toX(0)} y={toY(0)} width={toX(range)-toX(0)} height={toY(-range)-toY(0)} fill="rgba(251,191,36,.07)"/>
      {/* grid lines */}
      {ticks.map(t=>(
        <g key={'g'+t}>
          <line x1={toX(t)} y1={toY(-range)} x2={toX(t)} y2={toY(range)} stroke={t===0?'transparent':'#1e293b'} strokeWidth="1"/>
          <line x1={toX(-range)} y1={toY(t)} x2={toX(range)} y2={toY(t)} stroke={t===0?'transparent':'#1e293b'} strokeWidth="1"/>
        </g>
      ))}
      {/* axes */}
      <line x1={toX(-range)} y1={toY(0)} x2={toX(range)} y2={toY(0)} stroke="#f97316" strokeWidth="2.8"/>
      <line x1={toX(0)} y1={toY(-range)} x2={toX(0)} y2={toY(range)} stroke="#f97316" strokeWidth="2.8"/>
      {/* arrows */}
      <polygon points={`${toX(range)},${toY(0)} ${toX(range)-10},${toY(0)-6} ${toX(range)-10},${toY(0)+6}`} fill="#f97316"/>
      <polygon points={`${toX(0)},${toY(range)} ${toX(0)-6},${toY(range)+10} ${toX(0)+6},${toY(range)+10}`} fill="#f97316"/>
      <text x={toX(range)-6} y={toY(0)+18} fill="#fb923c" fontSize="13" fontWeight="800">X</text>
      <text x={toX(0)+10} y={toY(range)+14} fill="#fb923c" fontSize="13" fontWeight="800">Y</text>
      <text x={toX(0)+8} y={toY(0)+16} fill="#94a3b8" fontSize="12" fontWeight="700">O</text>
      {ticks.filter(t=>t!==0).map(t=>(
        <g key={'t'+t}>
          <text x={toX(t)} y={toY(0)+15} fill="#64748b" fontSize="11" textAnchor="middle">{t}</text>
          <text x={toX(0)-11} y={toY(t)+4} fill="#64748b" fontSize="11" textAnchor="end">{t}</text>
        </g>
      ))}
      {showQuadLabels && (
        <g fontSize="13" fontWeight="800" opacity="0.55">
          <text x={toX(range*0.45)} y={toY(range*0.55)} fill="#4ade80">I (+,+)</text>
          <text x={toX(-range*0.75)} y={toY(range*0.55)} fill="#60a5fa">II (−,+)</text>
          <text x={toX(-range*0.75)} y={toY(-range*0.45)} fill="#f472b6">III (−,−)</text>
          <text x={toX(range*0.4)} y={toY(-range*0.45)} fill="#fbbf24">IV (+,−)</text>
        </g>
      )}
      {highlight && showGuides && (
        <g>
          <line x1={toX(highlight.x)} y1={toY(0)} x2={toX(highlight.x)} y2={toY(highlight.y)} stroke="#34d399" strokeWidth="2" strokeDasharray="5 4"/>
          <line x1={toX(0)} y1={toY(highlight.y)} x2={toX(highlight.x)} y2={toY(highlight.y)} stroke="#60a5fa" strokeWidth="2" strokeDasharray="5 4"/>
          <circle cx={toX(highlight.x)} cy={toY(0)} r="3.5" fill="#34d399"/>
          <circle cx={toX(0)} cy={toY(highlight.y)} r="3.5" fill="#60a5fa"/>
        </g>
      )}
      {points.map((p,i)=>(
        <g key={i}>
          <circle cx={toX(p.x)} cy={toY(p.y)} r="8" fill={p.color||'#f97316'} stroke="#fff" strokeWidth="2"/>
          {p.label && (
            <text x={toX(p.x)+11} y={toY(p.y)-9} fill="#e2e8f0" fontSize="13" fontWeight="800">
              {p.label}{p.showCoord!==false?` (${p.x}, ${p.y})`:''}
            </text>
          )}
        </g>
      ))}
    </svg>
  );
}

    <div className="card h-full overflow-y-auto space-y-2">

        <div className="space-y-2">

            <div className="result-box text-center"><div className="text-2xl font-black amber">4</div><div className="text-sm slate">Quadrants</div></div>

function WhyTwoTab(){
  const [street,setStreet]=useState(2);
  const [house,setHouse]=useState(5);
  // mini street grid figure
  const cols=8, rows=5;
  return (
    <div className="card h-full overflow-y-auto space-y-2">
      <h2>Why Two Numbers?</h2>
      <p className="sub">One number is not enough. Street + house, or distance from two edges, uniquely fix a location.</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'.6rem'}}>
        <div className="result-box">
          <div className="text-base font-bold orange mb-1">Street & House (Fig. 3.1 style)</div>
          <div className="row">
            <div><label>Street</label><input type="number" min="1" max="8" value={street} onChange={e=>{setStreet(Math.min(8,Math.max(1,+e.target.value||1)));sound.playClick()}} className="input"/></div>
            <div><label>House</label><input type="number" min="1" max="5" value={house} onChange={e=>{setHouse(Math.min(5,Math.max(1,+e.target.value||1)));sound.playClick()}} className="input"/></div>
          </div>
          <div className="math">Location → ({street}, {house})</div>
          {/* street grid figure */}
          <div style={{marginTop:10,display:'inline-grid',gridTemplateColumns:`repeat(${cols},28px)`,gap:3}}>
            {Array.from({length:rows*cols},(_,i)=>{
              const c=(i%cols)+1, r=rows-Math.floor(i/cols);
              const on=c===street&&r===house;

function WhiteboardTab(){
  const canvasRef=useRef(null);
  const isDrawing=useRef(false);
  const lastPos=useRef({x:0,y:0});
  const [color,setColor]=useState('#f97316');
  const [size,setSize]=useState(4);
  const colorRef=useRef(color),sizeRef=useRef(size);
  colorRef.current=color;sizeRef.current=size;
  const getPos=useCallback((e)=>{
    const c=canvasRef.current;if(!c)return{x:0,y:0};
    const r=c.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return{x:(cx-r.left)*(c.width/r.width),y:(cy-r.top)*(c.height/r.height)};
  },[]);
  useEffect(()=>{
    const c=canvasRef.current;if(!c)return;
    const parent=c.parentElement;
    const resize=()=>{
      const dpr=window.devicePixelRatio||1,w=parent.clientWidth,h=parent.clientHeight;
      c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
      const ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
      ctx.fillStyle='#1e293b';ctx.fillRect(0,0,w,h);
      // draw faint axes
      ctx.strokeStyle='#334155';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
    };
    resize();window.addEventListener('resize',resize);
    const start=e=>{e.preventDefault();isDrawing.current=true;lastPos.current=getPos(e);};
    const stop=()=>{isDrawing.current=false;};
    const move=e=>{
      if(!isDrawing.current)return;e.preventDefault();
      const pos=getPos(e),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=sizeRef.current;ctx.lineCap='round';ctx.strokeStyle=colorRef.current;
      ctx.beginPath();ctx.moveTo(lastPos.current.x/dpr,lastPos.current.y/dpr);ctx.lineTo(pos.x/dpr,pos.y/dpr);ctx.stroke();
      lastPos.current=pos;
    };
    ['mousedown','mouseup','mouseleave','mousemove','touchstart','touchend','touchmove'].forEach(ev=>{
      const fn=ev.includes('down')||ev.includes('start')?start:ev.includes('up')||ev.includes('leave')||ev.includes('end')?stop:move;
      c.addEventListener(ev,fn,{passive:false});
    });
    return()=>window.removeEventListener('resize',resize);
  },[getPos]);
  const clear=()=>{sound.playClick();const c=canvasRef.current;if(!c)return;const ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;const w=c.width/dpr,h=c.height/dpr;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1e293b';ctx.fillRect(0,0,c.width,c.height);ctx.scale(dpr,dpr);ctx.strokeStyle='#334155';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();};
  return (
    <div className="card h-full flex flex-col space-y-2 overflow-hidden">
      <div className="flex flex-wrap gap-2 items-center flex-shrink-0">
        {['#f97316','#3b82f6','#10b981','#eab308','#ec4899','#ffffff'].map(c=>(
          <button key={c} onClick={()=>{setColor(c);sound.playClick()}} style={{width:28,height:28,borderRadius:'50%',background:c,border:color===c?'3px solid #fff':'2px solid transparent'}}/>
        ))}
        {[2,4,8].map(s=><button key={s} className={`btn btn-sm ${size===s?'btn-orange':'btn-dark'}`} onClick={()=>{setSize(s);sound.playClick()}}>{s}px</button>)}
        <button className="btn btn-sm" style={{background:'#dc2626',color:'#fff'}} onClick={clear}>Clear</button>
        <span className="text-sm slate">Axes drawn as guide — sketch points & figures</span>
      </div>
      <div className="flex-1 rounded-xl overflow-hidden border border-slate-600" style={{minHeight:0,touchAction:'none'}}>
        <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block',touchAction:'none',cursor:'crosshair'}}/>
      </div>
    </div>
  );
}
