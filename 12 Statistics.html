<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Statistics • Class 9 Chapter 12</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;background:#0b0f19;color:#f1f5f9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center;touch-action:manipulation}
.viewport-wrapper{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 25% 15%,#1e293b 0%,#0f172a 65%)}
.simulation-container{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.75);display:flex;flex-direction:column;overflow:hidden;background:#0f172a;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
.simulation-container:fullscreen,.simulation-container:-webkit-full-screen{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;border:none}
.glass{background:rgba(30,41,59,.96);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.6);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .15s ease-out}
.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.12rem}.gap-2{gap:.3rem}
.w-full{width:100%}.h-full{height:100%}.flex-1{flex:1 1 0%}
.overflow-y-auto{overflow-y:auto}.overflow-hidden{overflow:hidden}
.grid{display:grid}.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
h2{font-size:1.15rem;font-weight:800;color:#fb923c;margin-bottom:0}
.sub{font-size:.92rem;color:#e2e8f0;margin-bottom:.1rem;line-height:1.28}
.text-sm{font-size:.9rem}.text-xs{font-size:.8rem}
.font-bold{font-weight:700}
.orange{color:#fb923c}.amber{color:#fbbf24}.green{color:#4ade80}.red{color:#f87171}.blue{color:#60a5fa}.slate{color:#94a3b8}.white{color:#f8fafc}
.btn{cursor:pointer;border:none;border-radius:.35rem;font-weight:700;font-size:.84rem;padding:.26rem .5rem}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover{background:#f97316}
.btn-dark{background:#1e293b;color:#e2e8f0;border:1px solid #475569}.btn-dark:hover{background:#334155}
.btn-sm{padding:.2rem .42rem;font-size:.78rem}
.tab-bar{display:flex;overflow-x:auto;gap:.08rem;padding:.16rem .25rem;background:#0f172a;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.tab{display:flex;align-items:center;gap:.1rem;padding:.26rem .42rem;border-radius:.3rem;font-size:.72rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap;background:transparent;color:#94a3b8}
.tab:hover{background:#1e293b;color:#e2e8f0}.tab.on{background:#ea580c;color:#fff;box-shadow:0 2px 8px rgba(234,88,12,.45)}
.card{background:rgba(30,41,59,.98);border:1px solid rgba(255,255,255,.16);border-radius:.45rem;padding:.4rem .52rem}
.tip{margin-top:.1rem;padding:.32rem .48rem;background:rgba(251,191,36,.24);border-left:3px solid #fbbf24;border-radius:0 .3rem .3rem 0;font-size:.88rem;color:#fef3c7;line-height:1.3}
.tip-blue{margin-top:.1rem;padding:.32rem .48rem;background:rgba(96,165,250,.24);border-left:3px solid #60a5fa;border-radius:0 .3rem .3rem 0;font-size:.88rem;color:#dbeafe;line-height:1.3}
.tip-green{margin-top:.1rem;padding:.32rem .48rem;background:rgba(52,211,153,.24);border-left:3px solid #34d399;border-radius:0 .3rem .3rem 0;font-size:.88rem;color:#d1fae5;line-height:1.3}
.badge{display:inline-block;background:rgba(249,115,22,.42);color:#fdba74;padding:.05rem .32rem;border-radius:999px;font-size:.72rem;font-weight:800}
.quiz-opt{width:100%;text-align:left;padding:.38rem .48rem;border-radius:.35rem;border:2px solid #334155;background:#1e293b;color:#f1f5f9;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:.1rem;display:flex;align-items:center;gap:.3rem}
.quiz-opt:hover{border-color:#f97316}.quiz-opt.correct{background:rgba(16,185,129,.35);border-color:#34d399;color:#d1fae5}
.quiz-opt.wrong{background:rgba(239,68,68,.3);border-color:#f87171;color:#fecaca}
.quiz-opt.disabled{pointer-events:none;opacity:.7}
.fig{background:#0c1220;border:1px solid #334155;border-radius:7px;display:block}
.def-box{background:rgba(15,23,42,.95);border:1px solid #334155;border-radius:5px;padding:5px 8px;margin:2px 0}
.def-box .t{font-size:.86rem;font-weight:800;color:#fbbf24}
.def-box .b{font-size:.88rem;color:#e2e8f0;line-height:1.28}
input[type=range]{width:100%;height:6px;border-radius:3px;background:#334155;-webkit-appearance:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#f97316,#fbbf24);cursor:pointer}
input[type=number]{width:52px;background:#1e293b;border:1px solid #475569;color:#f1f5f9;border-radius:4px;padding:2px 4px;font-size:.85rem}

.dash-hero{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
@media(max-width:700px){.dash-hero{grid-template-columns:1fr}}
.dash-stat{background:linear-gradient(145deg,rgba(30,41,59,.95),rgba(15,23,42,.98));border:1px solid rgba(249,115,22,.4);border-radius:.6rem;padding:.55rem .7rem}
.dash-stat-label{font-size:.8rem;font-weight:800;color:#fb923c;text-transform:uppercase;letter-spacing:.04em}
.dash-stat-value{font-size:1.4rem;font-weight:900;color:#f8fafc}
.dash-bar{height:9px;background:#1e293b;border-radius:999px;margin-top:.3rem;overflow:hidden;border:1px solid #334155}
.dash-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ea580c,#fbbf24,#4ade80);transition:width .35s}
.dash-item{display:flex;align-items:center;justify-content:space-between;gap:.45rem;padding:.35rem .5rem;margin-bottom:.18rem;background:rgba(15,23,42,.9);border:1px solid #475569;border-radius:.4rem;cursor:pointer}
.dash-item:hover{border-color:#f97316}
.dash-item.done{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.1)}
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;border:1px solid #f97316;border-radius:8px;padding:5px 9px;font-size:.75rem;font-weight:600;max-width:220px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.tip-wrap:hover .tip-bubble{opacity:1}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(249,115,22,.3);color:#fb923c;font-size:.65rem;font-weight:900;cursor:help;margin-left:3px;border:1px solid rgba(249,115,22,.55)}
.formula-box{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(251,191,36,.12));border:1px solid rgba(249,115,22,.45);border-radius:.5rem;padding:.5rem .7rem;font-size:.9rem;line-height:1.4;margin:.25rem 0}
.result-box{background:#0f172a;border:1px solid #475569;border-radius:.5rem;padding:.5rem .7rem;font-size:.9rem;line-height:1.35}

</style>
</head>

class SoundEngine{
  constructor(){this.ctx=null;this.muted=false}
  init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}
  setMuted(v){this.muted=v}
  playClick(){if(this.muted)return;this.init();try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=620;g.gain.setValueAtTime(.09,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.04);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.04)}catch(e){}}
  playSuccess(){if(this.muted)return;this.init();try{const n=this.ctx.currentTime;[523,659,784].forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.11,n+i*.08);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.18);o.connect(g);g.connect(this.ctx.destination);o.start(n+i*.08);o.stop(n+i*.08+.18)})}catch(e){}}
  playError(){if(this.muted)return;this.init();try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sawtooth';o.frequency.value=160;g.gain.setValueAtTime(.06,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.09);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.09)}catch(e){}}
}
const sound=new SoundEngine();
function Tip({ text }) {
  return (<span className="tip-wrap"><span className="tip-icon" tabIndex={0}>?</span><span className="tip-bubble" role="tooltip">{text}</span></span>);
}

function ProgressDash({ visited, quizBest, quizAttempts, onGoTab }) {
  const topics = [
    {id:'over', name:'Overview', goal:'Data representation'},
    {id:'bar', name:'Bar Graphs', goal:'Discrete categories'},
    {id:'hist', name:'Histogram', goal:'Continuous data, equal width'},
    {id:'vary', name:'Varying Width', goal:'Frequency density'},
    {id:'poly', name:'Freq. Polygon', goal:'Join mid-points'},
    {id:'exp', name:'Explore', goal:'Build your own graph'},
    {id:'quiz', name:'Quiz', goal:'Score 8+ out of 10'}
  ];
  const total = topics.length;
  const visitedCount = topics.filter(t => visited[t.id]).length;
  const pct = Math.round(visitedCount / total * 100);
  const stars = quizBest >= 8 ? 3 : quizBest >= 6 ? 2 : quizBest >= 4 ? 1 : 0;
  return (
    <div className="h-full overflow-y-auto" style={{padding:4}}>
      <div className="card">
        <h2>📊 Progress Dashboard <Tip text="Visit each topic and take the quiz. Best score is saved here." /></h2>
        <p className="sub">NCERT Class 9 · Chapter 12 · Statistics</p>
        <div className="dash-hero">
          <div className="dash-stat">
            <div className="dash-stat-label">Exploration</div>
            <div className="dash-stat-value"><span className="green">{visitedCount}</span><span style={{color:'#64748b',fontSize:'.9rem'}}>/{total}</span></div>
            <div className="dash-bar"><div className="dash-bar-fill" style={{width:pct+'%'}}/></div>
            <div className="text-sm slate">{pct}% complete</div>
          </div>
          <div className="dash-stat">
            <div className="dash-stat-label">Quiz best</div>
            <div className="dash-stat-value"><span className="green">{quizBest}</span><span style={{color:'#64748b',fontSize:'.9rem'}}>/10</span></div>
            <div className="text-sm slate">{quizAttempts} attempts · {'⭐'.repeat(stars)||'☆'}</div>
          </div>
        </div>
        <div className="result-box" style={{marginTop:5}}>
          {topics.map(t => (
            <div key={t.id} className={'dash-item '+(visited[t.id]?'done':'')} onClick={()=>{sound.playClick();onGoTab(t.id);}}>
              <div>
                <div className="font-bold" style={{color:'#f8fafc'}}>{t.name}</div>
                <div className="text-sm slate">{t.goal}</div>
              </div>
              <span>{visited[t.id]?'✅':'⬜'}</span>
            </div>
          ))}
        </div>
        <div className="tip-blue"><strong className="blue">Goal:</strong> Explore all topics and score ≥ 8/10 on the quiz.</div>
        <div className="formula-box">Key: Bar graph · Histogram · Frequency density · Frequency polygon · Class intervals</div>
      </div>
    </div>
  );
}

  return (

function BarTab(){
  const [data,setData]=useState([
    {label:'Grocery',val:4},{label:'Rent',val:5},{label:'Education',val:5},
    {label:'Medicine',val:2},{label:'Fuel',val:2},{label:'Entertain.',val:1},{label:'Misc.',val:1}

  const W=380,H=200,padL=36,padB=36,padT=16,padR=12;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const gap=8, n=data.length;
  const barW=(chartW-(n+1)*gap)/n;
  const update=(i,v)=>{const nd=[...data];nd[i]={...nd[i],val:Math.max(0,Math.min(10,+v||0))};setData(nd)};
  return (
    <div className="h-full overflow-y-auto" style={{padding:3}}>
      <div className="card" style={{marginBottom:3}}>
        <h2>Bar Graphs</h2>
        <p className="sub">Family expenditure (₹ thousands) — drag values with the slider</p>
      </div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'center'}}>
          <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="fig">
            {/* axes */}
            <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            {[0,1,2,3,4,5].map(u=>(
              <g key={u}>
                <line x1={padL-3} y1={H-padB-(u/5)*chartH} x2={padL} y2={H-padB-(u/5)*chartH} stroke="#64748b"/>
                <text x={padL-6} y={H-padB-(u/5)*chartH+4} textAnchor="end" fill="#94a3b8" fontSize="11">{u}</text>
              </g>
            ))}
            {data.map((d,i)=>{

              const h=(d.val/Math.max(maxV,5))*chartH;
              const y=H-padB-h;
              return (
                <g key={i} style={{cursor:'pointer'}} onClick={()=>{setSel(i);sound.playClick()}}>
                  <rect x={x} y={y} width={barW} height={h} rx="3"
                    fill={sel===i?COLORS[i%COLORS.length]:COLORS[i%COLORS.length]+'cc'}
                    stroke={sel===i?'#fff':'none'} strokeWidth="2"/>
                  <text x={x+barW/2} y={H-padB+14} textAnchor="middle" fill="#94a3b8" fontSize="10">{d.label.slice(0,6)}</text>
                  <text x={x+barW/2} y={y-4} textAnchor="middle" fill="#fbbf24" fontSize="11" fontWeight="700">{d.val}</text>
                </g>

            })}
            <text x={W/2} y={H-2} textAnchor="middle" fill="#64748b" fontSize="11">Heads of expenditure</text>

        <div className="flex gap-2" style={{marginTop:4,flexWrap:'wrap',alignItems:'center'}}>
          {data.map((d,i)=>(
            <button key={i} className={'btn btn-sm '+(sel===i?'btn-orange':'btn-dark')} onClick={()=>{setSel(i);sound.playClick()}}>{d.label}</button>
          ))}
        </div>
        <label className="text-sm font-bold" style={{marginTop:4}}>{data[sel].label}: {data[sel].val} (₹ {data[sel].val}000)</label>
        <input type="range" min="0" max="10" step="1" value={data[sel].val} onChange={e=>update(sel,+e.target.value)}/>
        <div className="def-box" style={{marginTop:3}}>
          <div className="t">Definition</div>
          <div className="b">A <strong className="orange">bar graph</strong> uses bars of uniform width and equal spacing. Heights show the values of the variable.</div>
        </div>
        <div className="tip-blue">Education + Rent are highest (5). Entertainment + Misc. are lowest (1).</div>
      </div>

function HistUniformTab(){
  // Table 12.2 weights
  const classes=[
    {lo:30.5,hi:35.5,f:9},{lo:35.5,hi:40.5,f:6},{lo:40.5,hi:45.5,f:15},
    {lo:45.5,hi:50.5,f:3},{lo:50.5,hi:55.5,f:1},{lo:55.5,hi:60.5,f:2}
  ];
  const [showKink,setShowKink]=useState(true);
  const maxF=15;
  const W=400,H=210,padL=40,padB=40,padT=14,padR=14;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const xMin=showKink?28:30.5, xMax=60.5;
  const xScale=v=>padL+((v-xMin)/(xMax-xMin))*chartW;
  const yScale=f=>H-padB-(f/maxF)*chartH;
  return (
    <div className="h-full overflow-y-auto" style={{padding:3}}>
      <div className="card" style={{marginBottom:3}}>
        <h2>Histogram · uniform width</h2>
        <p className="sub">Weights of 36 students (Table 12.2) — class size = 5 kg</p>
      </div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'center'}}>
          <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="fig">
            <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            {[0,5,10,15].map(u=>(
              <g key={u}>
                <line x1={padL-3} y1={yScale(u)} x2={padL} y2={yScale(u)} stroke="#64748b"/>
                <text x={padL-6} y={yScale(u)+4} textAnchor="end" fill="#94a3b8" fontSize="11">{u}</text>
              </g>
            ))}
            {showKink && (
              <g>
                <path d={`M${xScale(28)} ${H-padB} L${xScale(29.2)} ${H-padB-6} L${xScale(30)} ${H-padB}`} fill="none" stroke="#fbbf24" strokeWidth="2"/>
                <text x={xScale(28.5)} y={H-padB+14} fill="#fbbf24" fontSize="10">kink</text>
              </g>
            )}
            {classes.map((c,i)=>{
              const x1=xScale(c.lo), x2=xScale(c.hi);
              const y=yScale(c.f);
              return (
                <g key={i}>
                  <rect x={x1} y={y} width={x2-x1} height={H-padB-y}
                    fill={COLORS[i%COLORS.length]+'99'} stroke={COLORS[i%COLORS.length]} strokeWidth="1.5"/>
                  <text x={(x1+x2)/2} y={y-4} textAnchor="middle" fill="#fbbf24" fontSize="12" fontWeight="700">{c.f}</text>
                </g>
              );
            })}
            {[30.5,35.5,40.5,45.5,50.5,55.5,60.5].map(v=>(
              <text key={v} x={xScale(v)} y={H-padB+14} textAnchor="middle" fill="#94a3b8" fontSize="10">{v}</text>
            ))}
            <text x={W/2} y={H-2} textAnchor="middle" fill="#64748b" fontSize="11">Weight (kg)</text>
            <text x={12} y={H/2} textAnchor="middle" fill="#64748b" fontSize="11" transform={`rotate(-90,12,${H/2})`}>Frequency</text>
          </svg>
        </div>
        <button className={'btn btn-sm '+(showKink?'btn-orange':'btn-dark')} style={{marginTop:3}}
          onClick={()=>{setShowKink(!showKink);sound.playClick()}}>{showKink?'Hide kink':'Show kink'}</button>
        <div className="def-box" style={{marginTop:3}}>
          <div className="t">Histogram</div>
          <div className="b">For <strong className="orange">continuous</strong> class intervals. Bars have width = class size and <strong>no gaps</strong>. Height = frequency (when widths are equal).</div>
        </div>
        <div className="tip">Kink (break) on the x-axis shows that the scale does not start at 0.</div>
      </div>
    </div>
  );
}

function HistVaryTab(){
  // Example with unequal widths - marks
  // intervals: 0-10 f=5, 10-20 f=10, 20-40 f=8 (width 20), 40-50 f=6, 50-70 f=4 (width 20)
  const raw=[
    {lo:0,hi:10,f:5},{lo:10,hi:20,f:10},{lo:20,hi:40,f:8},
    {lo:40,hi:50,f:6},{lo:50,hi:70,f:4}
  ];
  const base=10; // standard width for density
  const dens=raw.map(c=>({...c, d:(c.f/(c.hi-c.lo))*base}));
  const [mode,setMode]=useState('dens'); // dens | wrong
  const maxH=Math.max(...dens.map(c=>mode==='dens'?c.d:c.f),1);
  const W=400,H=210,padL=40,padB=40,padT=14,padR=14;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const xMin=0, xMax=70;
  const xScale=v=>padL+((v-xMin)/(xMax-xMin))*chartW;
  const yScale=v=>H-padB-(v/maxH)*chartH;
  return (
    <div className="h-full overflow-y-auto" style={{padding:3}}>
      <div className="card" style={{marginBottom:3}}>
        <h2>Histogram · varying width</h2>
        <p className="sub">Use <strong className="amber">frequency density</strong> so area ∝ frequency</p>
        <div className="flex gap-2" style={{marginTop:3}}>
          <button className={'btn btn-sm '+(mode==='dens'?'btn-orange':'btn-dark')} onClick={()=>{setMode('dens');sound.playClick()}}>Correct (density)</button>
          <button className={'btn btn-sm '+(mode==='wrong'?'btn-orange':'btn-dark')} onClick={()=>{setMode('wrong');sound.playClick()}}>Wrong (raw f)</button>
        </div>
      </div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'center'}}>
          <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="fig">
            <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            {dens.map((c,i)=>{
              const x1=xScale(c.lo), x2=xScale(c.hi);
              const hVal=mode==='dens'?c.d:c.f;
              const y=yScale(hVal);
              return (
                <g key={i}>
                  <rect x={x1} y={y} width={x2-x1} height={H-padB-y}
                    fill={COLORS[i%COLORS.length]+'99'} stroke={COLORS[i%COLORS.length]} strokeWidth="1.5"/>
                  <text x={(x1+x2)/2} y={y-4} textAnchor="middle" fill="#fbbf24" fontSize="11" fontWeight="700">
                    {mode==='dens'?c.d.toFixed(1):c.f}
                  </text>
                </g>
              );
            })}
            {[0,10,20,40,50,70].map(v=>(
              <text key={v} x={xScale(v)} y={H-padB+14} textAnchor="middle" fill="#94a3b8" fontSize="10">{v}</text>
            ))}
            <text x={W/2} y={H-2} textAnchor="middle" fill="#64748b" fontSize="11">Marks</text>
            <text x={12} y={H/2} textAnchor="middle" fill="#64748b" fontSize="10" transform={`rotate(-90,12,${H/2})`}>{mode==='dens'?'Density (per 10)':'Frequency'}</text>
          </svg>
        </div>
        <div className="def-box" style={{marginTop:3}}>
          <div className="t">Frequency density</div>
          <div className="b"><strong className="amber">density = frequency ÷ class width</strong> (adjusted to a standard width). Then <strong>area of bar ∝ frequency</strong>.</div>
        </div>
        <div className={mode==='dens'?'tip-green':'tip'} style={{marginTop:3}}>
          {mode==='dens'
            ? 'Correct: wider classes are shorter so areas stay proportional to frequency.'
            : 'Wrong: plotting raw frequency makes wider classes look taller than they should.'}
        </div>
      </div>
    </div>
  );
}

function PolygonTab(){
  const classes=[
    {lo:30.5,hi:35.5,f:9},{lo:35.5,hi:40.5,f:6},{lo:40.5,hi:45.5,f:15},
    {lo:45.5,hi:50.5,f:3},{lo:50.5,hi:55.5,f:1},{lo:55.5,hi:60.5,f:2}
  ];
  const [showHist,setShowHist]=useState(true);
  const [showPoly,setShowPoly]=useState(true);
  // midpoints + zero ends
  const pts=[
    {m:28,f:0},
    ...classes.map(c=>({m:(c.lo+c.hi)/2,f:c.f})),
    {m:63,f:0}
  ];
  const maxF=15;
  const W=400,H=210,padL=40,padB=40,padT=14,padR=14;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const xMin=26, xMax=65;
  const xScale=v=>padL+((v-xMin)/(xMax-xMin))*chartW;
  const yScale=f=>H-padB-(f/maxF)*chartH;
  const poly=pts.map(p=>`${xScale(p.m)},${yScale(p.f)}`).join(' ');
  return (
    <div className="h-full overflow-y-auto" style={{padding:3}}>
      <div className="card" style={{marginBottom:3}}>
        <h2>Frequency Polygon</h2>
        <p className="sub">Join mid-points of histogram tops · close with zero-frequency classes</p>
        <div className="flex gap-2" style={{marginTop:3}}>
          <button className={'btn btn-sm '+(showHist?'btn-orange':'btn-dark')} onClick={()=>{setShowHist(!showHist);sound.playClick()}}>{showHist?'Hide hist':'Show hist'}</button>
          <button className={'btn btn-sm '+(showPoly?'btn-orange':'btn-dark')} onClick={()=>{setShowPoly(!showPoly);sound.playClick()}}>{showPoly?'Hide polygon':'Show polygon'}</button>
        </div>
      </div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'center'}}>
          <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="fig">
            <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            {showHist && classes.map((c,i)=>{
              const x1=xScale(c.lo), x2=xScale(c.hi), y=yScale(c.f);
              return <rect key={i} x={x1} y={y} width={x2-x1} height={H-padB-y}
                fill="rgba(249,115,22,.25)" stroke="#fb923c" strokeWidth="1"/>;
            })}
            {showPoly && (
              <g>
                <polyline points={poly} fill="none" stroke="#34d399" strokeWidth="2.5"/>
                {pts.map((p,i)=>(
                  <circle key={i} cx={xScale(p.m)} cy={yScale(p.f)} r="5" fill="#fbbf24" stroke="#0f172a" strokeWidth="1"/>
                ))}
              </g>
            )}
            {[30.5,40.5,50.5,60.5].map(v=>(
              <text key={v} x={xScale(v)} y={H-padB+14} textAnchor="middle" fill="#94a3b8" fontSize="10">{v}</text>
            ))}
            <text x={W/2} y={H-2} textAnchor="middle" fill="#64748b" fontSize="11">Weight (kg)</text>
          </svg>
        </div>
        <div className="def-box" style={{marginTop:3}}>
          <div className="t">Frequency polygon</div>
          <div className="b">Line segments joining the mid-points of the tops of consecutive histogram bars. Zero-frequency classes at both ends make the <strong className="amber">area equal</strong> to the histogram.</div>
        </div>
        <div className="tip-blue">Mid-points: 33, 38, 43, 48, 53, 58 · ends at 28 & 63 with f = 0.</div>
      </div>
    </div>
  );
}

function ExploreTab(){
  const [vals,setVals]=useState([4,7,5,9,3,6]);
  const labels=['A','B','C','D','E','F'];
  const [type,setType]=useState('bar');
  const maxV=Math.max(...vals,1);
  const W=380,H=190,padL=36,padB=32,padT=14,padR=12;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const n=vals.length;
  const gap=type==='bar'?8:0;
  const barW=type==='bar'?(chartW-(n+1)*gap)/n:chartW/n;
  const update=(i,v)=>{const nv=[...vals];nv[i]=Math.max(0,Math.min(15,+v||0));setVals(nv)};
  // polygon points
  const mids=vals.map((v,i)=>({x:padL+(i+0.5)*(chartW/n), y:H-padB-(v/Math.max(maxV,10))*chartH}));
  const polyPts=[
    `${padL},${H-padB}`,
    ...mids.map(p=>`${p.x},${p.y}`),
    `${padL+chartW},${H-padB}`
  ].join(' ');
  return (
    <div className="h-full overflow-y-auto" style={{padding:3}}>
      <div className="card" style={{marginBottom:3}}>
        <h2>Explore · build a graph</h2>
        <p className="sub">Change values · switch chart type</p>
        <div className="flex gap-2" style={{marginTop:3}}>
          {[['bar','Bar'],['hist','Histogram'],['poly','Polygon']].map(([k,l])=>(
            <button key={k} className={'btn btn-sm '+(type===k?'btn-orange':'btn-dark')} onClick={()=>{setType(k);sound.playClick()}}>{l}</button>
          ))}
        </div>
      </div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'center'}}>
          <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="fig">
            <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#64748b" strokeWidth="2"/>
            {type!=='poly' && vals.map((v,i)=>{
              const x=type==='bar'?padL+gap+i*(barW+gap):padL+i*barW;
              const h=(v/Math.max(maxV,10))*chartH;
              return (
                <rect key={i} x={x} y={H-padB-h} width={barW} height={h} rx={type==='bar'?3:0}
                  fill={COLORS[i%COLORS.length]+'bb'} stroke={COLORS[i%COLORS.length]} strokeWidth="1.5"/>
              );
            })}
            {type==='poly' && (
              <g>
                <polyline points={polyPts} fill="rgba(52,211,153,.15)" stroke="#34d399" strokeWidth="2.5"/>
                {mids.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="5" fill="#fbbf24"/>)}
              </g>
            )}
            {labels.map((l,i)=>(
              <text key={l} x={padL+(i+0.5)*(chartW/n)} y={H-padB+14} textAnchor="middle" fill="#94a3b8" fontSize="12">{l}</text>
            ))}
          </svg>
        </div>
        <div className="grid grid-3" style={{gap:3,marginTop:4}}>
          {vals.map((v,i)=>(
            <div key={i} className="def-box" style={{margin:0}}>
              <div className="t">{labels[i]} = {v}</div>
              <input type="range" min="0" max="15" value={v} onChange={e=>update(i,+e.target.value)}/>
            </div>
          ))}
        </div>
        <div className="tip" style={{marginTop:3}}>Total = {vals.reduce((a,b)=>a+b,0)} · Max = {maxV}</div>
      </div>
    </div>
  );
}

function QuizTab({ onQuizComplete, quizBest }){
  const questions=[
    {q:'A bar graph is best for…',opts:['Continuous data','Discrete categories','Time series only','Circles'],c:1,exp:'Bars of uniform width with equal gaps show discrete categories.'},
    {q:'In a histogram, consecutive bars…',opts:['Have gaps','Touch each other','Overlap','Are circles'],c:1,exp:'No gaps — continuous class intervals.'},
    {q:'Frequency density = …',opts:['f × width','f ÷ class width','f + width','width ÷ f'],c:1,exp:'density = frequency ÷ class width.'},
    {q:'Why use frequency density for unequal class widths?',opts:['Looks prettier','Area ∝ frequency','Height = frequency','None'],c:1,exp:'So the area of each bar is proportional to frequency.'},
    {q:'A frequency polygon is drawn by joining…',opts:['Bar bottoms','Class mid-points of tops','Origins','Random points'],c:1,exp:'Mid-points of the upper sides of histogram rectangles.'},
    {q:'A kink on the axis means…',opts:['Error','Scale does not start at 0','Maximum value','Zero frequency'],c:1,exp:'Break in the axis when the first class does not start at zero.'},
    {q:'Bar graphs have…',opts:['No gaps','Equal gaps between bars','Overlapping bars','Circles'],c:1,exp:'Equal spacing between bars of uniform width.'},
    {q:'Closing a frequency polygon with zero-frequency classes makes…',opts:['Area larger','Area = histogram area','Area zero','None'],c:1,exp:'Area of polygon equals area of histogram.'},
    {q:'Histogram is used for…',opts:['Names of months','Continuous grouped data','Favourite colours','None'],c:1,exp:'Continuous class intervals (e.g. weight in kg).'},
    {q:'In equal-width histogram, height of bar represents…',opts:['Class mark','Frequency','Density only','Range'],c:1,exp:'When widths are equal, height = frequency.'},
  ];
  const [idx,setIdx]=useState(0),[score,setScore]=useState(0),[sel,setSel]=useState(null),[show,setShow]=useState(false),[done,setDone]=useState(false);
  const q=questions[idx];
  const submit=i=>{if(show)return;setSel(i);setShow(true);if(i===q.c){setScore(s=>s+1);sound.playSuccess()}else sound.playError()};
  const next=()=>{if(idx+1<questions.length){setIdx(idx+1);setSel(null);setShow(false)}else setDone(true)};
  if(done) return (
    <div className="h-full flex items-center justify-center">
      <div className="card" style={{maxWidth:300,textAlign:'center'}}>
        <div style={{fontSize:26}}>🎉</div>
        <h2>Quiz Complete</h2>
        <p className="orange font-bold">Score: {score}/{questions.length}</p>
        {quizBest>0 && <p className="text-sm slate">Best so far: <span className="orange font-bold">{Math.max(quizBest,score)}/10</span></p>}
        <button className="btn btn-orange" style={{marginTop:5}} onClick={()=>{ if(onQuizComplete) onQuizComplete(score); setIdx(0);setScore(0);setSel(null);setShow(false);setDone(false); sound.playClick(); }}>Save & Retry</button>
      </div>
    </div>
  );
  return (
    <div className="h-full flex items-center justify-center overflow-y-auto" style={{padding:3}}>
      <div className="card" style={{maxWidth:470,width:'100%'}}>
        <div className="flex justify-between text-sm slate"><span>Q {idx+1}/{questions.length}</span><span className="orange font-bold">Score: {score}</span></div>
        <div style={{height:5,background:'#1e293b',borderRadius:3,margin:'4px 0',overflow:'hidden'}}>
          <div style={{height:'100%',width:`${((idx+(show?1:0))/questions.length)*100}%`,background:'linear-gradient(90deg,#f97316,#fbbf24)'}}/>
        </div>
        <h2 style={{fontSize:'1.02rem',color:'#f8fafc'}}>{q.q}</h2>
        <div style={{marginTop:5}}>
          {q.opts.map((o,i)=>(
            <button key={i} className={`quiz-opt ${show?(i===q.c?'correct':i===sel?'wrong':'disabled'):''}`} onClick={()=>submit(i)} disabled={show}>
              <span style={{width:22,height:22,borderRadius:5,background:show&&i===q.c?'#10b981':show&&i===sel?'#ef4444':'#ea580c',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:11,color:'#fff'}}>{String.fromCharCode(65+i)}</span>
              {o}
            </button>
          ))}
        </div>
        {show && (
          <div className={sel===q.c?'tip-green':'tip'} style={{marginTop:4}}>
            <strong>{sel===q.c?'✅ Correct!':'❌ Not quite.'}</strong> {q.exp}
            {sel!==q.c && <div className="green" style={{marginTop:1}}>Answer: {String.fromCharCode(65+q.c)}. {q.opts[q.c]}</div>}
            <button className="btn btn-orange btn-sm" style={{marginTop:4}} onClick={next}>{idx+1<questions.length?'Next →':'Results'}</button>
          </div>
        )}
      </div>
    </div>
  );
}

const TABS=[
  {id:'progress',label:'0. Progress',icon:'📊'},
  {id:'over',label:'1. Overview',icon:'📖'},
  {id:'bar',label:'2. Bar Graphs',icon:'📊'},
  {id:'hist',label:'3. Histogram',icon:'▮'},
  {id:'vary',label:'4. Varying Width',icon:'▭'},
  {id:'poly',label:'5. Freq. Polygon',icon:'📈'},
  {id:'exp',label:'6. Explore',icon:'🛠'},
  {id:'quiz',label:'7. Quiz',icon:'❓'},
];

function App(){
  const [tab,setTab]=useState('progress');
  const [muted,setMuted]=useState(false);
  const [isFs,setIsFs]=useState(false);
  const [visited,setVisited]=useState({progress:true});
  const [quizBest,setQuizBest]=useState(0);
  const [quizAttempts,setQuizAttempts]=useState(0);
  useEffect(()=>{sound.setMuted(muted)},[muted]);
  useEffect(()=>{
    const fn=()=>setIsFs(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange',fn);
    return ()=>document.removeEventListener('fullscreenchange',fn);
  },[]);
  const toggleFs=()=>{
    const el=document.querySelector('.simulation-container');
    if(!document.fullscreenElement) el?.requestFullscreen?.();
    else document.exitFullscreen?.();
  };
  const goTab=(id)=>{sound.playClick();setTab(id);setVisited(v=>({...v,[id]:true}));};
  const onQuizComplete=(score)=>{setQuizAttempts(a=>a+1);setQuizBest(b=>Math.max(b,score));};
  const content={progress:<ProgressDash visited={visited} quizBest={quizBest} quizAttempts={quizAttempts} onGoTab={goTab}/>,over:<OverviewTab/>,bar:<BarTab/>,hist:<HistUniformTab/>,vary:<HistVaryTab/>,poly:<PolygonTab/>,exp:<ExploreTab/>,quiz:<QuizTab onQuizComplete={onQuizComplete} quizBest={quizBest}/>};
  return (
    <div className="h-full flex flex-col">
      <header className="glass flex justify-between items-center flex-shrink-0" style={{padding:'7px 11px',borderBottom:'1px solid rgba(255,255,255,.1)'}}>
        <div className="flex items-center gap-2">
          {LOGO ? <img src={LOGO} alt="APMF" style={{width:48,height:48,borderRadius:10,objectFit:'contain',background:'transparent'}}/> :
            <div style={{width:44,height:44,borderRadius:9,background:'#0f172a',display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid #334155'}}>
              <span style={{fontSize:10,fontWeight:900,color:'#f97316'}}>APMF</span>
            </div>}
          <div>
            <h1 style={{fontSize:16,fontWeight:900,color:'#fff',margin:0}}>Statistics</h1>
            <p style={{fontSize:11,color:'#94a3b8',margin:0}}>NCERT Class 9 • Chapter 12</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <div style={{textAlign:'right',lineHeight:1.2}}>
            <div style={{fontSize:11,fontWeight:700,color:'#fb923c'}}>Andhra Pradesh Mathematics Forum</div>
            <div style={{fontSize:12,fontWeight:700,color:'#fff'}}>Gangalapudi Bhasker Reddy</div>
          </div>
          <div className="flex gap-1" style={{background:'#1e293b',padding:4,borderRadius:9,border:'1px solid #334155'}}>
            <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setMuted(!muted)}}>{muted?'🔇':'🔊'}</button>
            <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();toggleFs()}}>{isFs?'🗗':'⛶'}</button>
          </div>
        </div>
      </header>
      <div className="tab-bar">
        {TABS.map(t=>(
          <button key={t.id} className={`tab ${tab===t.id?'on':''}`} onClick={()=>goTab(t.id)}>
            <span>{t.icon}</span><span>{t.label}</span>
          </button>
        ))}
      </div>
      <main className="flex-1 overflow-hidden" style={{padding:2}}><div className="h-full fade">{content[tab]}</div></main>
      <footer className="glass flex justify-between items-center flex-shrink-0" style={{padding:'3px 11px',fontSize:11,color:'#94a3b8',borderTop:'1px solid rgba(255,255,255,.1)'}}>
        <span>NCERT Class 9 • Ch 12 · Statistics</span>
        <span>APMF · <strong style={{color:'#e2e8f0'}}>Gangalapudi Bhasker Reddy</strong></span>
      </footer>
    </div>
  );
}

try{ReactDOM.createRoot(document.getElementById('root')).render(<App/>)}
catch(err){document.getElementById('root').innerHTML='<div style="padding:16px;color:#fca5a5"><pre>'+String(err)+'</pre></div>'}
</script>
</body>
</html>
