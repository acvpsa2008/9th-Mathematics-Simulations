<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Quadrilaterals • Class 9 Chapter 8</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;background:#0b0f19;color:#f1f5f9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center;touch-action:manipulation}
.viewport-wrapper{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 25% 15%,#1e293b 0%,#0f172a 65%)}
.simulation-container{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.75);display:flex;flex-direction:column;overflow:hidden;background:#0f172a;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
.simulation-container:fullscreen,.simulation-container:-webkit-full-screen{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;border:none}
.glass{background:rgba(30,41,59,.96);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(249,115,22,.6);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .15s ease-out}
.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.12rem}.gap-2{gap:.3rem}
.w-full{width:100%}.h-full{height:100%}.flex-1{flex:1 1 0%}
.overflow-y-auto{overflow-y:auto}.overflow-hidden{overflow:hidden}
.grid{display:grid}.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
h2{font-size:1.2rem;font-weight:800;color:#fb923c;margin-bottom:0}
.sub{font-size:.95rem;color:#e2e8f0;margin-bottom:.1rem;line-height:1.28}
.text-sm{font-size:.93rem}.text-xs{font-size:.82rem}
.font-bold{font-weight:700}
.orange{color:#fb923c}.amber{color:#fbbf24}.green{color:#4ade80}.red{color:#f87171}.blue{color:#60a5fa}.slate{color:#94a3b8}.white{color:#f8fafc}
.btn{cursor:pointer;border:none;border-radius:.35rem;font-weight:700;font-size:.84rem;padding:.26rem .5rem}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover{background:#f97316}
.btn-dark{background:#1e293b;color:#e2e8f0;border:1px solid #475569}.btn-dark:hover{background:#334155}
.btn-sm{padding:.2rem .42rem;font-size:.78rem}
.tab-bar{display:flex;overflow-x:auto;gap:.08rem;padding:.16rem .25rem;background:#0f172a;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.tab{display:flex;align-items:center;gap:.1rem;padding:.26rem .42rem;border-radius:.3rem;font-size:.72rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap;background:transparent;color:#94a3b8}
.tab:hover{background:#1e293b;color:#e2e8f0}.tab.on{background:#ea580c;color:#fff;box-shadow:0 2px 8px rgba(234,88,12,.45)}
.card{background:rgba(30,41,59,.98);border:1px solid rgba(255,255,255,.16);border-radius:.45rem;padding:.4rem .52rem}
.tip{margin-top:.1rem;padding:.32rem .48rem;background:rgba(251,191,36,.24);border-left:3px solid #fbbf24;border-radius:0 .3rem .3rem 0;font-size:.88rem;color:#fef3c7;line-height:1.3}
.tip-blue{margin-top:.1rem;padding:.32rem .48rem;background:rgba(96,165,250,.24);border-left:3px solid #60a5fa;border-radius:0 .3rem .3rem 0;font-size:.88rem;color:#dbeafe;line-height:1.3}
.tip-green{margin-top:.1rem;padding:.32rem .48rem;background:rgba(52,211,153,.24);border-left:3px solid #34d399;border-radius:0 .3rem .3rem 0;font-size:.88rem;color:#d1fae5;line-height:1.3}
.badge{display:inline-block;background:rgba(249,115,22,.42);color:#fdba74;padding:.05rem .32rem;border-radius:999px;font-size:.72rem;font-weight:800}
.quiz-opt{width:100%;text-align:left;padding:.38rem .48rem;border-radius:.35rem;border:2px solid #334155;background:#1e293b;color:#f1f5f9;font-size:.92rem;font-weight:600;cursor:pointer;margin-bottom:.1rem;display:flex;align-items:center;gap:.3rem}
.quiz-opt:hover{border-color:#f97316}.quiz-opt.correct{background:rgba(16,185,129,.35);border-color:#34d399;color:#d1fae5}
.quiz-opt.wrong{background:rgba(239,68,68,.3);border-color:#f87171;color:#fecaca}
.quiz-opt.disabled{pointer-events:none;opacity:.7}
.fig{background:#0c1220;border:1px solid #334155;border-radius:7px;display:block}
.def-box{background:rgba(15,23,42,.95);border:1px solid #334155;border-radius:5px;padding:5px 8px;margin:2px 0}
.def-box .t{font-size:.86rem;font-weight:800;color:#fbbf24}
.def-box .b{font-size:.88rem;color:#e2e8f0;line-height:1.28}
input[type=range]{width:100%;height:6px;border-radius:3px;background:#334155;-webkit-appearance:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#f97316,#fbbf24);cursor:pointer}

.dash-hero{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
@media(max-width:700px){.dash-hero{grid-template-columns:1fr}}
.dash-stat{background:linear-gradient(145deg,rgba(30,41,59,.95),rgba(15,23,42,.98));border:1px solid rgba(249,115,22,.4);border-radius:.6rem;padding:.55rem .7rem}
.dash-stat-label{font-size:.8rem;font-weight:800;color:#fb923c;text-transform:uppercase;letter-spacing:.04em}
.dash-stat-value{font-size:1.4rem;font-weight:900;color:#f8fafc}
.dash-bar{height:9px;background:#1e293b;border-radius:999px;margin-top:.3rem;overflow:hidden;border:1px solid #334155}
.dash-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ea580c,#fbbf24,#4ade80);transition:width .35s}
.dash-item{display:flex;align-items:center;justify-content:space-between;gap:.45rem;padding:.35rem .5rem;margin-bottom:.18rem;background:rgba(15,23,42,.9);border:1px solid #475569;border-radius:.4rem;cursor:pointer}
.dash-item:hover{border-color:#f97316}
.dash-item.done{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.1)}
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;border:1px solid #f97316;border-radius:8px;padding:5px 9px;font-size:.75rem;font-weight:600;max-width:220px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.tip-wrap:hover .tip-bubble{opacity:1}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(249,115,22,.3);color:#fb923c;font-size:.65rem;font-weight:900;cursor:help;margin-left:3px;border:1px solid rgba(249,115,22,.55)}
.formula-box{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(251,191,36,.12));border:1px solid rgba(249,115,22,.45);border-radius:.5rem;padding:.5rem .7rem;font-size:.9rem;line-height:1.4;margin:.25rem 0}
.result-box{background:#0f172a;border:1px solid #475569;border-radius:.5rem;padding:.5rem .7rem;font-size:.9rem;line-height:1.35}

</style>
</head>

class SoundEngine{
  constructor(){this.ctx=null;this.muted=false}
  init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}
  setMuted(v){this.muted=v}
  playClick(){if(this.muted)return;this.init();try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=620;g.gain.setValueAtTime(.09,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.04);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.04)}catch(e){}}
  playSuccess(){if(this.muted)return;this.init();try{const n=this.ctx.currentTime;[523,659,784].forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.11,n+i*.08);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.18);o.connect(g);g.connect(this.ctx.destination);o.start(n+i*.08);o.stop(n+i*.08+.18)})}catch(e){}}
  playError(){if(this.muted)return;this.init();try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sawtooth';o.frequency.value=160;g.gain.setValueAtTime(.06,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.09);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.09)}catch(e){}}
}

function ParallelTab(){
  const [mode,setMode]=useState('alt');
  const [ang,setAng]=useState(55);
  const [skew,setSkew]=useState(0);
  const [gap,setGap]=useState(70); // distance between parallels (bottom y - top y)
  const [picked,setPicked]=useState(null);
  const [dragging,setDragging]=useState(null);
  const svgRef = React.useRef(null);
  const co = 180-ang;
  const y1 = 50, y2 = 50 + gap;
  const tx1 = 110 + skew, ty1 = 12, tx2 = 200 - skew, ty2 = 158;
  const tTop = (y1-ty1)/(ty2-ty1);
  const tBot = (y2-ty1)/(ty2-ty1);
  const ix1 = tx1 + tTop*(tx2-tx1);
  const ix2 = tx1 + tBot*(tx2-tx1);

  const clientToSvg = (clientX, clientY) => {
    const svg = svgRef.current;
    if(!svg) return {x:0,y:0};
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM();
    if(!ctm) return {x:0,y:0};
    const p = pt.matrixTransform(ctm.inverse());
    return {x:p.x, y:p.y};
  };

  const onPointerDown = (e, which) => {
    e.preventDefault();
    e.stopPropagation();
    setDragging(which);
    sound.playClick();
    try{ e.target.setPointerCapture?.(e.pointerId); }catch(_){}
  };
  const onPointerMove = (e) => {
    if(!dragging) return;
    const {x,y} = clientToSvg(e.clientX, e.clientY);
    if(dragging==='skew'){
      // map x of transversal midpoint-ish to skew range
      const midX = (x);
      const newSkew = Math.max(-40, Math.min(40, midX - 155));
      setSkew(Math.round(newSkew));
    } else if(dragging==='gap'){
      const newGap = Math.max(45, Math.min(95, y - y1));
      setGap(Math.round(newGap));
    }
  };
  const onPointerUp = () => setDragging(null);

  return (
    <div className="h-full overflow-y-auto" style={{padding:3}}>
      <div className="card" style={{marginBottom:3}}>
        <h2>Parallel lines · angle rules</h2>
        <p className="sub">Drag the <strong className="amber">handles</strong> on the transversal or lower line · click angles</p>
        <div className="flex gap-2" style={{marginTop:3}}>
          {[['alt','Alternate'],['corr','Corresponding'],['co','Co-interior']].map(([k,l])=>(
            <button key={k} className={'btn btn-sm '+(mode===k?'btn-orange':'btn-dark')} onClick={()=>{setMode(k);setPicked(null);sound.playClick()}}>{l}</button>
          ))}
        </div>
      </div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'center'}}>
          <svg ref={svgRef} width="400" height="230" viewBox="0 0 330 180" className="fig"
            onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
            style={{touchAction:'none'}}>
            {/* upper parallel (fixed) */}
            <line x1="20" y1={y1} x2="310" y2={y1} stroke="#fb923c" strokeWidth="3.5"/>
            {/* lower parallel — draggable via handle */}
            <line x1="20" y1={y2} x2="310" y2={y2} stroke="#fb923c" strokeWidth="3.5"/>
            <text x="5" y={y1+5} fill="#fb923c" fontSize="16" fontWeight="800">l</text>
            <text x="5" y={y2+5} fill="#fb923c" fontSize="16" fontWeight="800">m</text>
            {/* transversal */}
            <line x1={tx1} y1={ty1} x2={tx2} y2={ty2} stroke="#60a5fa" strokeWidth="2.8"/>
            <text x={tx2+5} y={ty2+8} fill="#60a5fa" fontSize="14" fontWeight="700">p</text>
            <circle cx={ix1} cy={y1} r="4.5" fill="#e2e8f0"/>
            <circle cx={ix2} cy={y2} r="4.5" fill="#e2e8f0"/>

            {/* DRAG HANDLE on transversal midpoint */}
            <circle cx={(tx1+tx2)/2} cy={(ty1+ty2)/2} r="11"
              fill={dragging==='skew'?'#f97316':'#60a5fa'} stroke="#fff" strokeWidth="2"
              style={{cursor:'ew-resize'}}
              onPointerDown={e=>onPointerDown(e,'skew')}/>
            <text x={(tx1+tx2)/2-6} y={(ty1+ty2)/2+4} fill="#fff" fontSize="11" fontWeight="900" pointerEvents="none">⇄</text>

            {/* DRAG HANDLE on lower parallel (right end) */}
            <circle cx="295" cy={y2} r="11"
              fill={dragging==='gap'?'#f97316':'#fb923c'} stroke="#fff" strokeWidth="2"
              style={{cursor:'ns-resize'}}
              onPointerDown={e=>onPointerDown(e,'gap')}/>
            <text x="289" y={y2+4} fill="#fff" fontSize="11" fontWeight="900" pointerEvents="none">⇅</text>

            {mode==='alt' && (
              <>
                <g style={{cursor:'pointer'}} onClick={()=>{setPicked('a1');sound.playClick()}}>
                  <path d={`M${ix1},${y1} L${ix1-16},${y1} A18,18 0 0,0 ${ix1-8},${y1+14}`} fill={picked==='a1'?'rgba(251,191,36,.35)':'none'} stroke="#fbbf24" strokeWidth="2.5"/>
                  <text x={ix1-38} y={y1+18} fill={picked==='a1'?'#34d399':'#fbbf24'} fontSize="16" fontWeight="800">{ang}°</text>
                </g>
                <g style={{cursor:'pointer'}} onClick={()=>{setPicked('a2');sound.playClick()}}>
                  <path d={`M${ix2},${y2} L${ix2+16},${y2} A18,18 0 0,0 ${ix2+8},${y2-14}`} fill={picked==='a2'?'rgba(251,191,36,.35)':'none'} stroke="#fbbf24" strokeWidth="2.5"/>
                  <text x={ix2+18} y={y2-6} fill={picked==='a2'?'#34d399':'#fbbf24'} fontSize="16" fontWeight="800">{ang}°</text>
                </g>
                <text x="90" y={(y1+y2)/2+5} fill="#34d399" fontSize="14" fontWeight="700">alternate interior · equal</text>
              </>
            )}
            {mode==='corr' && (
              <>
                <g style={{cursor:'pointer'}} onClick={()=>{setPicked('c1');sound.playClick()}}>
                  <path d={`M${ix1},${y1} L${ix1-16},${y1} A18,18 0 0,1 ${ix1-8},${y1-14}`} fill={picked==='c1'?'rgba(251,191,36,.35)':'none'} stroke="#fbbf24" strokeWidth="2.5"/>
                  <text x={ix1-38} y={y1-8} fill={picked==='c1'?'#34d399':'#fbbf24'} fontSize="16" fontWeight="800">{ang}°</text>
                </g>
                <g style={{cursor:'pointer'}} onClick={()=>{setPicked('c2');sound.playClick()}}>
                  <path d={`M${ix2},${y2} L${ix2-16},${y2} A18,18 0 0,1 ${ix2-8},${y2-14}`} fill={picked==='c2'?'rgba(251,191,36,.35)':'none'} stroke="#fbbf24" strokeWidth="2.5"/>
                  <text x={ix2-40} y={y2-8} fill={picked==='c2'?'#34d399':'#fbbf24'} fontSize="16" fontWeight="800">{ang}°</text>
                </g>
                <text x="90" y={(y1+y2)/2+5} fill="#34d399" fontSize="14" fontWeight="700">corresponding · equal</text>
              </>
            )}
            {mode==='co' && (
              <>
                <g style={{cursor:'pointer'}} onClick={()=>{setPicked('co1');sound.playClick()}}>
                  <path d={`M${ix1},${y1} L${ix1+16},${y1} A18,18 0 0,1 ${ix1+8},${y1+14}`} fill={picked==='co1'?'rgba(251,191,36,.35)':'none'} stroke="#fbbf24" strokeWidth="2.5"/>
                  <text x={ix1+18} y={y1-2} fill={picked==='co1'?'#34d399':'#fbbf24'} fontSize="16" fontWeight="800">{ang}°</text>
                </g>
                <g style={{cursor:'pointer'}} onClick={()=>{setPicked('co2');sound.playClick()}}>
                  <path d={`M${ix2},${y2} L${ix2+16},${y2} A18,18 0 0,0 ${ix2+8},${y2-14}`} fill={picked==='co2'?'rgba(96,165,250,.35)':'none'} stroke="#60a5fa" strokeWidth="2.5"/>
                  <text x={ix2+18} y={y2-6} fill={picked==='co2'?'#34d399':'#60a5fa'} fontSize="16" fontWeight="800">{co}°</text>
                </g>
                <text x="75" y={(y1+y2)/2+5} fill="#34d399" fontSize="13" fontWeight="700">co-interior · same side · sum = 180°</text>
                <text x="110" y={y2+28} fill="#94a3b8" fontSize="14">{ang}° + {co}° = 180°</text>
              </>
            )}
          </svg>
        </div>
        <label className="text-sm font-bold">Angle measure: {ang}°{mode==='co'?` · partner ${co}°`:''}</label>

function QuizTab({ onQuizComplete, quizBest }){
  const questions=[
    {q:'A diagonal of a parallelogram divides it into…',opts:['Two similar triangles','Two congruent triangles','Four triangles','Two trapeziums'],c:1,exp:'Thm 8.1 — ASA.'},
    {q:'In a parallelogram, opposite sides are…',opts:['Unequal','Equal','Perpendicular','None'],c:1,exp:'Thm 8.2.'},
    {q:'Diagonals of a parallelogram…',opts:['Are equal','Are perpendicular','Bisect each other','Never meet'],c:2,exp:'Thm 8.6.'},
    {q:'Diagonals of a rhombus…',opts:['Equal only','⊥ bisectors of each other','Parallel','None'],c:1,exp:'Bisect at 90°.'},
    {q:'A rectangle is a parallelogram with…',opts:['Equal sides','One right angle','No parallel sides','Unequal diags'],c:1,exp:'One right ∠ ⇒ all 90°.'},
    {q:'Mid-point theorem: mid-points join is…',opts:['⊥ third side','‖ third side and half','Equal to third','None'],c:1,exp:'Thm 8.8.'},
    {q:'If diags of a quadrilateral bisect each other, it is a…',opts:['Trapezium','Kite','Parallelogram','Triangle'],c:2,exp:'Thm 8.7.'},
    {q:'Co-interior angles between parallel lines…',opts:['Are equal','Sum to 180°','Sum to 90°','Are vertical'],c:1,exp:'Supplementary — used for ∠A+∠B=180°.'},
    {q:'Diagonals of a square…',opts:['Unequal','Equal and perpendicular','Parallel','None'],c:1,exp:'Equal, ⊥, bisect.'},
    {q:'A square is…',opts:['Only a rectangle','Only a rhombus','Both rectangle and rhombus','Neither'],c:2,exp:'Special case of both.'},
  ];
  const [idx,setIdx]=useState(0),[score,setScore]=useState(0),[sel,setSel]=useState(null),[show,setShow]=useState(false),[done,setDone]=useState(false);
  const q=questions[idx];
  const submit=i=>{if(show)return;setSel(i);setShow(true);if(i===q.c){setScore(s=>s+1);sound.playSuccess()}else sound.playError()};
  const next=()=>{if(idx+1<questions.length){setIdx(idx+1);setSel(null);setShow(false)}else setDone(true)};
  if(done) return (
    <div className="h-full flex items-center justify-center">
      <div className="card" style={{maxWidth:300,textAlign:'center'}}>
        <div style={{fontSize:26}}>🎉</div>
        <h2>Quiz Complete</h2>
        <p className="orange font-bold">Score: {score}/{questions.length}</p>
        {quizBest>0 && <p className="text-sm slate">Best so far: <span className="orange font-bold">{Math.max(quizBest,score)}/10</span></p>}
        <button className="btn btn-orange" style={{marginTop:5}} onClick={()=>{ if(onQuizComplete) onQuizComplete(score); setIdx(0);setScore(0);setSel(null);setShow(false);setDone(false); sound.playClick(); }}>Save & Retry</button>
      </div>
    </div>
  );
  return (
    <div className="h-full flex items-center justify-center overflow-y-auto" style={{padding:3}}>
      <div className="card" style={{maxWidth:470,width:'100%'}}>
        <div className="flex justify-between text-sm slate"><span>Q {idx+1}/{questions.length}</span><span className="orange font-bold">Score: {score}</span></div>
        <div style={{height:5,background:'#1e293b',borderRadius:3,margin:'4px 0',overflow:'hidden'}}>
          <div style={{height:'100%',width:`${((idx+(show?1:0))/questions.length)*100}%`,background:'linear-gradient(90deg,#f97316,#fbbf24)'}}/>
        </div>
        <h2 style={{fontSize:'1.02rem',color:'#f8fafc'}}>{q.q}</h2>
        <div style={{marginTop:5}}>
          {q.opts.map((o,i)=>(
            <button key={i} className={`quiz-opt ${show?(i===q.c?'correct':i===sel?'wrong':'disabled'):''}`} onClick={()=>submit(i)} disabled={show}>
              <span style={{width:22,height:22,borderRadius:5,background:show&&i===q.c?'#10b981':show&&i===sel?'#ef4444':'#ea580c',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:11,color:'#fff'}}>{String.fromCharCode(65+i)}</span>
              {o}
            </button>
          ))}
        </div>
        {show && (
          <div className={sel===q.c?'tip-green':'tip'} style={{marginTop:4}}>
            <strong>{sel===q.c?'✅ Correct!':'❌ Not quite.'}</strong> {q.exp}
            {sel!==q.c && <div className="green" style={{marginTop:1}}>Answer: {String.fromCharCode(65+q.c)}. {q.opts[q.c]}</div>}
            <button className="btn btn-orange btn-sm" style={{marginTop:4}} onClick={next}>{idx+1<questions.length?'Next →':'Results'}</button>
          </div>
        )}
      </div>
    </div>
  );
}

  return (

      <header className="glass flex justify-between items-center flex-shrink-0" style={{padding:'7px 11px',borderBottom:'1px solid rgba(255,255,255,.1)'}}>
        <div className="flex items-center gap-2">
          {LOGO ? <img src={LOGO} alt="APMF" style={{width:48,height:48,borderRadius:10,objectFit:'contain',background:'transparent'}}/> :
            <div style={{width:44,height:44,borderRadius:9,background:'#0f172a',display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid #334155'}}>
              <span style={{fontSize:10,fontWeight:900,color:'#f97316'}}>APMF</span>
            </div>}
          <div>
            <h1 style={{fontSize:16,fontWeight:900,color:'#fff',margin:0}}>Quadrilaterals</h1>
            <p style={{fontSize:11,color:'#94a3b8',margin:0}}>NCERT Class 9 • Chapter 8</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <div style={{textAlign:'right',lineHeight:1.2}}>
            <div style={{fontSize:11,fontWeight:700,color:'#fb923c'}}>Andhra Pradesh Mathematics Forum</div>
            <div style={{fontSize:12,fontWeight:700,color:'#fff'}}>Gangalapudi Bhasker Reddy</div>
          </div>
          <div className="flex gap-1" style={{background:'#1e293b',padding:4,borderRadius:9,border:'1px solid #334155'}}>
            <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();setMuted(!muted)}}>{muted?'🔇':'🔊'}</button>
            <button className="btn btn-dark btn-sm" onClick={()=>{sound.playClick();toggleFs()}}>{isFs?'🗗':'⛶'}</button>
          </div>
        </div>
      </header>
      <div className="tab-bar">
        {TABS.map(t=>(
          <button key={t.id} className={`tab ${tab===t.id?'on':''}`} onClick={()=>goTab(t.id)}>
            <span>{t.icon}</span><span>{t.label}</span>
          </button>
        ))}
      </div>
      <main className="flex-1 overflow-hidden" style={{padding:2}}><div className="h-full fade">{content[tab]}</div></main>
      <footer className="glass flex justify-between items-center flex-shrink-0" style={{padding:'3px 11px',fontSize:11,color:'#94a3b8',borderTop:'1px solid rgba(255,255,255,.1)'}}>
        <span>NCERT Class 9 • Ch 8 · Quadrilaterals</span>
        <span>APMF · <strong style={{color:'#e2e8f0'}}>Gangalapudi Bhasker Reddy</strong></span>
      </footer>
    </div>
  );
}

try{ReactDOM.createRoot(document.getElementById('root')).render(<App/>)}
catch(err){document.getElementById('root').innerHTML='<div style="padding:16px;color:#fca5a5"><pre>'+String(err)+'</pre></div>'}
</script>
</body>
